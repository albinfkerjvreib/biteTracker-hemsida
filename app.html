// --- AI CHAT ---
function AIChatView({ t, currentTheme, lures, catches }) {
  const [messages, setMessages] = useState([
    { sender: 'ai', text: "Hej! Jag är din fiske-AI. Jag analyserar din beteslåda och dina fångster för att ge dig perfekta tips!" }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const chatEndRef = useRef(null);

  const handleSend = async (e) => {
    e.preventDefault();
    if (!input.trim() || loading) return;

    const userMsg = input;
    setInput('');
    setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
    setLoading(true);

    try {
      const contextInfo = `Beteslåda: ${JSON.stringify(lures)}. Fångster: ${JSON.stringify(catches)}.`;
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: "system", content: "Du är en expert på fiske som hjälper till med betesval och taktik. " + contextInfo },
            { role: "user", content: userMsg }
          ]
        })
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "Kunde inte svara just nu.";
      setMessages(prev => [...prev, { sender: 'ai', text: reply }]);
    } catch (err) {
      setMessages(prev => [...prev, { sender: 'ai', text: "Ett nätverksfel uppstod vid kontakt med servern." }]);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  return (
    <div className="p-4 flex flex-col h-[calc(100vh-140px)] max-w-xl mx-auto">
      <div className="bg-white p-4 rounded-2xl shadow-sm border mb-3 flex items-center justify-between">
        <h2 className={`text-xl font-bold ${currentTheme.text} flex items-center gap-2`}><Bot className="h-6 w-6"/> {t('ai_title')}</h2>
        <span className="bg-teal-50 text-teal-700 text-xs font-bold px-3 py-1 rounded-full">PRO Aktiv</span>
      </div>
      <div className="flex-1 bg-white border rounded-2xl p-4 shadow-sm overflow-y-auto space-y-3 mb-3">
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[85%] p-3.5 rounded-2xl text-sm ${m.sender === 'user' ? `${currentTheme.bg} text-white rounded-br-none` : 'bg-slate-100 text-slate-800 rounded-bl-none'}`}>
              {m.text}
            </div>
          </div>
        ))}
        {loading && <div className="text-slate-400 text-sm flex items-center gap-2"><Loader2 className="animate-spin h-4 w-4"/> {t('ai_thinking')}</div>}
        <div ref={chatEndRef} />
      </div>
      <form onSubmit={handleSend} className="flex gap-2">
        <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder={t('ai_placeholder')} className="flex-1 p-3.5 bg-white border rounded-xl outline-none text-sm shadow-sm" />
        <button type="submit" disabled={loading} className={`${currentTheme.bg} text-white px-5 rounded-xl shadow flex items-center justify-center`}><Send className="h-5 w-5"/></button>
      </form>
    </div>
  );
}

// --- FLÖDE ---
function FeedView({ globalFeed, user, t, currentTheme, isPro, setShowAuthModal }) {
  const [weather, setWeather] = useState(null);

  useEffect(() => {
    const fetchWeather = async () => {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.3293&longitude=18.0686&current_weather=true&daily=temperature_2m_max&timezone=Europe%2FBerlin');
        const data = await res.json();
        if (data && data.current_weather) {
            setWeather({ temp: data.current_weather.temperature, wind: data.current_weather.windspeed, pressure: 1012 });
        }
      } catch (err) {
        setWeather({ temp: 15, wind: 4.2, pressure: 1015 });
      }
    };
    fetchWeather();
  }, []);

  const handleLike = async (post) => {
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    const ref = db.collection('artifacts').doc(appId).collection('public_feed').doc(post.id);
    const likes = post.likes || [];
    if (likes.includes(user.uid)) await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(user.uid) });
    else await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(user.uid) });
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      {!isPro && (
        <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
          <div>
            <h3 className="font-bold text-sm flex items-center gap-1.5"><Sparkles className="h-4 w-4"/> Lås upp BiteTracker PRO</h3>
            <p className="text-xs text-amber-100 mt-0.5">Logga in för att spara fångster och beten permanent!</p>
          </div>
          <button onClick={() => setShowAuthModal(true)} className="bg-white text-amber-900 font-bold px-4 py-2 rounded-xl text-xs shadow">Logga In</button>
        </div>
      )}

      <div className="bg-gradient-to-br from-teal-800 to-slate-900 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div>
          <span className="text-[10px] text-teal-300 uppercase tracking-widest font-black">Väder & Prognos</span>
          <h3 className="font-bold text-base flex items-center gap-1.5"><SunIcon className="h-5 w-5 text-amber-400"/> {weather ? `${weather.temp}°C` : '15°C'} • Vind {weather ? `${weather.wind} m/s` : '4 m/s'}</h3>
        </div>
        <div className="bg-amber-400 text-slate-900 font-black px-3 py-2 rounded-xl text-center text-xs shadow">
          <span>🔥 Nappindex</span>
          <span className="block text-sm">8/10</span>
        </div>
      </div>

      <div className="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between">
        <div>
          <h2 className={`text-xl font-bold ${currentTheme.text}`}>Fiske-Flöde</h2>
          <p className="text-xs text-slate-500">Se vad andra fiskare drar upp i realtid</p>
        </div>
      </div>

      <div className="space-y-4">
        {globalFeed.length === 0 ? (
          <div className="text-center p-8 bg-white rounded-2xl border border-dashed">
            <p className="text-slate-500 text-sm">Inga fångster i flödet ännu.</p>
          </div>
        ) : (
          globalFeed.map(post => {
            const likesCount = (post.likes || []).length;
            const hasLiked = user && !user.isAnonymous && (post.likes || []).includes(user.uid);
            return (
              <div key={post.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div className="p-4 flex items-center justify-between border-b">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-xs">{post.authorName?.charAt(0) || 'F'}</div>
                    <div>
                      <span className="font-bold text-sm block flex items-center gap-1">
                        {post.authorName || 'Fiskare'}
                        {post.isOG && <span className="bg-amber-400 text-slate-900 text-[9px] font-black px-1.5 py-0.2 rounded-full">🏆 OG</span>}
                      </span>
                      <span className="text-[10px] text-slate-400">{post.location || 'Sverige'}</span>
                    </div>
                  </div>
                  <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">{post.species}</span>
                </div>
                {post.image && <img src={post.image} alt={post.species} className="w-full h-64 object-cover" />}
                <div className="p-4 space-y-2">
                  <p className="text-sm font-semibold">⚖️ {post.weight} kg {post.length ? `• 📏 ${post.length} cm` : ''} {post.lure ? `• 🎣 ${post.lure}` : ''}</p>
                  {post.description && <p className="text-xs text-slate-600">"{post.description}"</p>}
                  <button onClick={() => handleLike(post)} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-xl ${hasLiked ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-600'}`}>
                    <Heart className={`h-4 w-4 ${hasLiked ? 'fill-red-500 text-red-500' : ''}`}/> {likesCount}
                  </button>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// --- TÄVLINGAR ---
function CompetitionView({ globalFeed, user, t, currentTheme, isPro }) {
  const [competitions, setCompetitions] = useState([]);
  const [showCreateModal, setShowCreateModal] = useState(false);
  const [compTitle, setCompTitle] = useState('');
  const [compTarget, setCompTarget] = useState('Gädda');
  const [joinCode, setJoinCode] = useState('');

  useEffect(() => {
    const ref = db.collection('artifacts').doc(appId).collection('competitions');
    return ref.onSnapshot(snap => {
      const list = [];
      snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      setCompetitions(list);
    });
  }, []);

  const handleCreateComp = async (e) => {
    e.preventDefault();
    if (!compTitle) return;
    try {
        await db.collection('artifacts').doc(appId).collection('competitions').add({
        title: compTitle, target: compTarget, creator: user?.email || 'Fiskare',
        code: Math.random().toString(36).substring(2, 8).toUpperCase(),
        participants: [user?.uid || 'guest'],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        setShowCreateModal(false); setCompTitle('');
        alert("Privat tävling skapad!");
    } catch(err) { alert("Fel vid skapande."); }
  };

  const handleJoinComp = async (e) => {
    e.preventDefault();
    if (!joinCode) return;
    try {
        const snap = await db.collection('artifacts').doc(appId).collection('competitions').where('code', '==', joinCode.toUpperCase()).get();
        if (snap.empty) alert("Hittade ingen tävling.");
        else {
          const doc = snap.docs[0];
          await doc.ref.update({ participants: firebase.firestore.FieldValue.arrayUnion(user?.uid || 'guest') });
          alert(`Gick med i: ${doc.data().title}!`);
          setJoinCode('');
        }
    } catch(err) { alert("Kunde ej ansluta."); }
  };

  const sorted = [...globalFeed].sort((a, b) => b.weight - a.weight);

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      <div className="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between">
        <div>
          <h2 className={`text-xl font-bold ${currentTheme.text} flex items-center gap-2`}><Trophy className="h-6 w-6 text-amber-500"/> Tävlingar</h2>
          <p className="text-xs text-slate-500">Global topplista eller privat</p>
        </div>
        <button onClick={() => { if(!isPro){alert("Logga in för att skapa!"); return;} setShowCreateModal(true); }} className={`${currentTheme.bg} text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow`}>
          + Skapa Privat
        </button>
      </div>

      <form onSubmit={handleJoinComp} className="bg-white p-4 rounded-2xl shadow-sm border flex gap-2">
        <input type="text" placeholder="Inbjudningskod..." value={joinCode} onChange={e => setJoinCode(e.target.value)} className="flex-1 p-3 bg-slate-50 border rounded-xl text-sm uppercase" />
        <button type="submit" className="bg-amber-600 text-white font-bold px-4 rounded-xl text-xs">Gå med</button>
      </form>

      {competitions.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl space-y-2">
          <h3 className="font-bold text-amber-900 text-sm">Privata Tävlingar</h3>
          {competitions.map(c => (
            <div key={c.id} className="bg-white p-3 rounded-xl flex items-center justify-between shadow-sm">
              <div><p className="font-bold text-sm text-slate-800">🏆 {c.title}</p><p className="text-[10px] text-slate-500">Mål: {c.target}</p></div>
              <span className="bg-amber-100 text-amber-800 text-xs font-black px-2.5 py-1 rounded-lg">{c.code}</span>
            </div>
          ))}
        </div>
      )}

      <div className="bg-white rounded-2xl shadow-sm border p-4 space-y-3">
        <h3 className="font-bold text-sm text-slate-700">Månadens Topplista</h3>
        {sorted.length === 0 ? <p className="text-xs text-slate-400">Inga bidrag ännu.</p> : sorted.slice(0, 5).map((item, index) => (

            <input type="text" placeholder="Tävlingsnamn" value={compTitle} onChange={e => setCompTitle(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <select value={compTarget} onChange={e => setCompTarget(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
              <option value="Gädda">Gädda</option><option value="Abborre">Abborre</option><option value="Gös">Gös</option>
            </select>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowCreateModal(false)} className="flex-1 bg-slate-100 text-slate-700 font-bold p-3 rounded-xl text-sm">Avbryt</button>
              <button type="submit" className="flex-1 bg-amber-600 text-white font-bold p-3 rounded-xl text-sm">Skapa</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// --- PROFIL ---
function ProfileView({ user, profile, currentTheme, isPro, setShowAuthModal, onOpenSettings, catches, lures }) {
  const [bio, setBio] = useState(profile.bio || '');
  const [lureName, setLureName] = useState('');
  const [lureType, setLureType] = useState('');
  const [lureColor, setLureColor] = useState('');

  useEffect(() => { setBio(profile.bio || ''); }, [profile]);

  const handleSaveBio = async (e) => {
    e.preventDefault();
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    try {
      await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').set({ bio }, { merge: true });
      alert("Beskrivning sparad!");
    } catch(err) { alert("Kunde inte spara."); }
  };

  const handleAvatarChange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    const reader = new FileReader();
    reader.onloadend = async () => {
      try {
        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').set({ avatar: reader.result }, { merge: true });
        alert("Bild uppdaterad!");
      } catch(err) { alert("Kunde ej spara bild."); }
    };
    reader.readAsDataURL(file);
  };

  const handleAddLure = async (e) => {
    e.preventDefault();
    if (!lureName) return;
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    try {
      await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').add({
        name: lureName, type: lureType, color: lureColor, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setLureName(''); setLureType(''); setLureColor('');
      alert("✅ Bete tillagt!");
    } catch(err) { alert("Kunde ej spara bete."); }
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto pb-10">
      <div className="bg-white p-5 rounded-2xl shadow-sm border text-center space-y-3 relative">
        <button onClick={onOpenSettings} className="absolute top-4 right-4 bg-slate-100 hover:bg-slate-200 p-2 rounded-full text-slate-700 shadow-sm transition">
          <Settings className="h-5 w-5"/>
        </button>

        <div className="relative w-24 h-24 mx-auto group pt-2">
          {profile.avatar ? (
            <img src={profile.avatar} alt="Profil" className="w-24 h-24 rounded-full object-cover shadow border-2 border-teal-700" />
          ) : (
            <div className="w-24 h-24 bg-teal-100 text-teal-800 rounded-full flex items-center justify-center text-3xl font-black shadow border-2 border-teal-700">
              {profile.displayName ? profile.displayName.charAt(0) : '👤'}
            </div>
          )}
          <label className="absolute bottom-0 right-0 bg-teal-700 text-white p-1.5 rounded-full cursor-pointer shadow hover:bg-teal-800 text-xs">
            📷<input type="file" accept="image/*" onChange={handleAvatarChange} className="hidden" />
          </label>
        </div>

        <h2 className={`text-xl font-bold ${currentTheme.text} flex items-center justify-center gap-1.5`}>
          {profile.displayName || 'Inloggad Fiskare'}
          {profile.isOG && <span className="bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow">🏆 OG Medlem</span>}
        </h2>
        <p className="text-xs text-slate-500">{user?.email || (user?.isAnonymous ? 'Gäst-konto' : 'PRO-medlem')}</p>
        
        {isPro ? (
          <span className="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full"><Sparkles className="inline h-3 w-3"/> PRO Medlem Aktiv</span>
        ) : (
          <button onClick={() => setShowAuthModal(true)} className="bg-amber-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow">Logga in för PRO</button>
        )}

        <form onSubmit={handleSaveBio} className="pt-2 text-left space-y-2 border-t mt-4">
          <label className="text-xs font-bold text-slate-700">Om mig</label>
          <textarea value={bio} onChange={e => setBio(e.target.value)} placeholder="Skriv lite om dig själv..." className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none h-16 resize-none" />
          <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold py-2 rounded-xl text-xs shadow`}>Spara Beskrivning</button>
        </form>
      </div>

      <div className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5"><Package className="h-5 w-5 text-teal-700"/> Min Beteslåda ({lures.length})</h3>
        <form onSubmit={handleAddLure} className="space-y-2">
          <input type="text" placeholder="Betets namn..." value={lureName} onChange={e => setLureName(e.target.value)} required className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
          <div className="grid grid-cols-2 gap-2">
            <input type="text" placeholder="Typ (t.ex. Wobbler)" value={lureType} onChange={e => setLureType(e.target.value)} className="p-2.5 bg-slate-50 border rounded-xl text-xs" />
            <input type="text" placeholder="Färg" value={lureColor} onChange={e => setLureColor(e.target.value)} className="p-2.5 bg-slate-50 border rounded-xl text-xs" />
          </div>
          <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold py-2.5 rounded-xl text-xs`}>+ Lägg till bete</button>
        </form>
        {lures.length > 0 && (
          <div className="grid grid-cols-2 gap-2 pt-2">
            {lures.map(l => (
              <div key={l.id} className="bg-slate-50 p-2.5 rounded-xl border text-xs">
                <p className="font-bold text-slate-800">🎣 {l.name}</p>
                <p className="text-[10px] text-slate-500">{l.type || 'Bete'} {l.color ? `• ${l.color}` : ''}</p>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5"><Fish className="h-5 w-5 text-teal-700"/> Dina Fångster ({catches.length})</h3>
        {catches.length === 0 ? <p className="text-xs text-slate-400">Inga fångster loggade ännu.</p> : (
          <div className="space-y-2">
            {catches.map(c => (
              <div key={c.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border text-xs">
                <div><p className="font-bold text-slate-800">🐟 {c.species}</p><p className="text-[10px] text-slate-500">{c.location}</p></div>
                <span className="font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">{c.weight} kg</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// --- KARTA MED FILTER FÖR FÅNGSTER, SJÖAR OCH PRIVATA MARKÖRER ---
function MapView({ user, currentTheme, isPro }) {
  const [leafletLoaded, setLeafletLoaded] = useState(false);
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersLayer = useRef(null);
  const tileLayerRef = useRef(null);

  const [approvedLakes, setApprovedLakes] = useState([]);
  const [privateMarkers, setPrivateMarkers] = useState([]);
  const [globalCatches, setGlobalCatches] = useState([]);

  // Filter-states
  const [showLakes, setShowLakes] = useState(true);
  const [showPrivate, setShowPrivate] = useState(true);
  const [showCatches, setShowCatches] = useState(true);

  const [clickedCoords, setClickedCoords] = useState(null);
  const [showSuggestModal, setShowSuggestModal] = useState(false);
  const [showPrivateModal, setShowPrivateModal] = useState(false);

  const [suggestName, setSuggestName] = useState('');
  const [suggestRules, setSuggestRules] = useState('');
  const [suggestFish, setSuggestFish] = useState('');
  const [privateTitle, setPrivateTitle] = useState('');
  const [privateType, setPrivateType] = useState('Brygga');

  useEffect(() => {
    // Hämta sjöar
    db.collection('artifacts').doc(appId).collection('approved_lakes').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() })); setApprovedLakes(list);
    });
    // Hämta globala fångster med koordinater
    db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() })); setGlobalCatches(list);
    });
  }, []);

  useEffect(() => {
    if (!user || user.isAnonymous) return;
    db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('private_pins').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() })); setPrivateMarkers(list);
    });
  }, [user]);

  useEffect(() => {
    if (window.L) { setLeafletLoaded(true); return; }
    const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(link);
    const script = document.createElement('script'); script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; script.onload = () => setLeafletLoaded(true); document.head.appendChild(script);
  }, []);

  useEffect(() => {
    if (!leafletLoaded || !mapRef.current || mapInstance.current) return;
    const map = window.L.map(mapRef.current, { zoomControl: false, tap: true }).setView([60.128, 18.643], 5);
    tileLayerRef.current = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);
    window.L.control.zoom({ position: 'bottomright' }).addTo(map);

    map.on('click', (e) => setClickedCoords({ lat: e.latlng.lat, lng: e.latlng.lng }));
    mapInstance.current = map;
    markersLayer.current = window.L.layerGroup().addTo(map);
  }, [leafletLoaded]);

  // Rita ut markörer baserat på aktiva filter
  useEffect(() => {
    if (!mapInstance.current || !markersLayer.current || !window.L) return;
    markersLayer.current.clearLayers();

    const lakeIcon = window.L.divIcon({ className: 'custom-icon', html: "<div style='background-color:#0d9488; width:20px; height:20px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.5); text-align:center; font-size:10px;'>🌊</div>", iconSize: [22, 22], iconAnchor: [11, 11] });
    const privateIcon = window.L.divIcon({ className: 'custom-icon', html: "<div style='background-color:#f59e0b; width:18px; height:18px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.5); text-align:center; font-size:9px;'>⚓</div>", iconSize: [20, 20], iconAnchor: [10, 10] });
    const catchIcon = window.L.divIcon({ className: 'custom-icon', html: "<div style='background-color:#10b981; width:18px; height:18px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.5); text-align:center; font-size:9px;'>🐟</div>", iconSize: [20, 20], iconAnchor: [10, 10] });

    if (showLakes) {
      approvedLakes.forEach(l => {
        if (l.lat && l.lng) {
          window.L.marker([l.lat, l.lng], { icon: lakeIcon }).addTo(markersLayer.current).bindPopup(`<b>🌊 ${l.name}</b><br>Fisk: ${l.fish || 'Diverse'}<br>Regler: ${l.rules}`);
        }
      });
    }

    if (showPrivate && isPro) {
      privateMarkers.forEach(p => {
        if (p.lat && p.lng) {
          window.L.marker([p.lat, p.lng], { icon: privateIcon }).addTo(markersLayer.current).bindPopup(`<b>🔒 [PRO] ${p.title}</b><br>Typ: ${p.type}`);
        }
      });
    }

    if (showCatches) {
      globalCatches.forEach(c => {
        if (c.lat && c.lng) {
          window.L.marker([c.lat, c.lng], { icon: catchIcon }).addTo(markersLayer.current).bindPopup(`<b>🐟 ${c.species} (${c.weight} kg)</b><br>Fiskare: ${c.authorName || 'Fiskare'}`);
        }
      });
    }
  }, [approvedLakes, privateMarkers, globalCatches, showLakes, showPrivate, showCatches, isPro, leafletLoaded]);

  const handleSendSuggestion = async (e) => {
    e.preventDefault();
    if (!suggestName || !clickedCoords) return;
    await db.collection('artifacts').doc(appId).collection('lake_suggestions').add({
      name: suggestName, rules: suggestRules || 'Standard', fish: suggestFish || 'Diverse',
      lat: clickedCoords.lat, lng: clickedCoords.lng, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setShowSuggestModal(false); setSuggestName(''); setClickedCoords(null);
    alert("✅ Sjön har skickats in för granskning!");
  };

  const handleSavePrivate = async (e) => {
    e.preventDefault();
    if (!isPro) { alert("Kräver PRO!"); return; }
    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('private_pins').add({
      title: privateTitle, type: privateType, lat: clickedCoords.lat, lng: clickedCoords.lng, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setShowPrivateModal(false); setPrivateTitle(''); setClickedCoords(null);
    alert("✅ Privat plats sparad!");
  };

  return (
    <div className="relative w-full h-[calc(100vh-140px)]">
      {/* FILTER-MENY HÖGST UPP PÅ KARTAN */}
      <div className="absolute top-4 left-4 right-4 z-[400] max-w-xl mx-auto flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-lg border text-xs font-bold">
        <button onClick={() => setShowLakes(!showLakes)} className={`flex-1 py-1.5 rounded-xl border transition ${showLakes ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600'}`}>🌊 Sjöar</button>
        <button onClick={() => setShowCatches(!showCatches)} className={`flex-1 py-1.5 rounded-xl border transition ${showCatches ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}>🐟 Fångster</button>
        <button onClick={() => { if(!isPro){alert("Kräver PRO!");return;} setShowPrivate(!showPrivate); }} className={`flex-1 py-1.5 rounded-xl border transition ${showPrivate && isPro ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600'}`}>⚓ Privata {isPro ? '' : '(PRO)'}</button>
      </div>

      <div ref={mapRef} className="w-full h-full" />

      {clickedCoords && !showSuggestModal && !showPrivateModal && (
        <div className="absolute bottom-4 left-4 right-4 bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border z-[1000] max-w-xl mx-auto space-y-3">
          <div className="flex justify-between items-center">
            <h3 className="font-bold text-slate-800 text-sm">📍 Position vald på kartan</h3>
            <button onClick={() => setClickedCoords(null)} className="text-slate-400"><X className="h-5 w-5"/></button>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => setShowSuggestModal(true)} className="bg-teal-700 text-white font-bold p-3 rounded-xl text-xs shadow">Föreslå sjö</button>
            <button onClick={() => { if (!isPro) { alert("Kräver PRO!"); return; } setShowPrivateModal(true); }} className="bg-amber-600 text-white font-bold p-3 rounded-xl text-xs shadow">Spara privat (PRO)</button>
          </div>
        </div>
      )}

      {showSuggestModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={handleSendSuggestion} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg text-slate-800">Föreslå Sjö</h3>
            <input type="text" placeholder="Sjöns namn" value={suggestName} onChange={e => setSuggestName(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <input type="text" placeholder="Fiskarter" value={suggestFish} onChange={e => setSuggestFish(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <textarea placeholder="Regler..." value={suggestRules} onChange={e => setSuggestRules(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-20 resize-none" />
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowSuggestModal(false)} className="flex-1 bg-slate-100 p-3 rounded-xl text-sm font-bold">Avbryt</button>
              <button type="submit" className="flex-1 bg-teal-700 text-white p-3 rounded-xl text-sm font-bold">Skicka</button>
            </div>
          </form>
        </div>
      )}

      {showPrivateModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={handleSavePrivate} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg text-slate-800">Spara Privat Markör</h3>
            <input type="text" placeholder="Titel (t.ex. Bryggan)" value={privateTitle} onChange={e => setPrivateTitle(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <select value={privateType} onChange={e => setPrivateType(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
              <option value="Brygga">Brygga</option><option value="Hemlig spot">Hemlig spot</option><option value="Sjöramp">Sjöramp</option>
            </select>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowPrivateModal(false)} className="flex-1 bg-slate-100 p-3 rounded-xl text-sm font-bold">Avbryt</button>
              <button type="submit" className="flex-1 bg-amber-600 text-white p-3 rounded-xl text-sm font-bold">Spara</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// --- LOGGA FÅNGST (MED GEOLOKALISERING FÖR KARTAN) ---
function CatchLogView({ user, t, currentTheme, profile }) {
  const [species, setSpecies] = useState('');
  const [weight, setWeight] = useState('');
  const [length, setLength] = useState('');
  const [lure, setLure] = useState('');
  const [description, setDescription] = useState('');
  const [image, setImage] = useState(null);
  const [location, setLocation] = useState('');
  const [coords, setCoords] = useState(null);
  const [sharePublic, setSharePublic] = useState(true);

  // Hämta GPS-position automatiskt om tillåtet
  const handleGetGPS = () => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        alert("📍 GPS-position hämtad för fångsten!");
      }, () => alert("Kunde inte hämta position."));
    }
  };

  const handleSave = async (e) => {
    e.preventDefault();
    if (!species || !weight || !location) return;
    
    try {
        const data = {
          species, weight: parseFloat(weight), length: length ? parseFloat(length) : null,
          lure, description, image, location,
          lat: coords ? coords.lat : 59.3293,
          lng: coords ? coords.lng : 18.0686,
          authorName: profile.displayName || 'Fiskare',
          isOG: profile.isOG || false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').add(data);
        if (sharePublic) {
          await db.collection('artifacts').doc(appId).collection('public_feed').add(data);
        }

        setSpecies(''); setWeight(''); setLength(''); setLure(''); setDescription(''); setImage(null); setLocation(''); setCoords(null);
        alert("✅ Fångst sparad!");
    } catch(err) { alert("Fel vid sparande."); }
  };

  return (
    <div className="p-4 max-w-xl mx-auto space-y-4">
      <div className="bg-white p-4 rounded-2xl shadow-sm border"><h2 className={`text-xl font-bold ${currentTheme.text}`}>Logga Fångst</h2></div>
      <form onSubmit={handleSave} className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <input type="text" placeholder="Fiskart (t.ex. Gädda)" value={species} onChange={e => setSpecies(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        <div className="grid grid-cols-2 gap-2">
          <input type="number" step="0.1" placeholder="Vikt (kg)" value={weight} onChange={e => setWeight(e.target.value)} required className="p-3 bg-slate-50 border rounded-xl text-sm" />
          <input type="number" placeholder="Längd (cm)" value={length} onChange={e => setLength(e.target.value)} className="p-3 bg-slate-50 border rounded-xl text-sm" />
        </div>
        <input type="text" placeholder="Bete / Drag" value={lure} onChange={e => setLure(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        <div className="flex gap-2">
          <input type="text" placeholder="Plats / Sjö" value={location} onChange={e => setLocation(e.target.value)} required className="flex-1 p-3 bg-slate-50 border rounded-xl text-sm" />
          <button type="button" onClick={handleGetGPS} className="bg-teal-700 text-white px-4 rounded-xl text-xs font-bold">📍 GPS</button>
        </div>
        <textarea placeholder="Beskrivning..." value={description} onChange={e => setDescription(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-20 resize-none" />
        <input type="file" accept="image/*" onChange={e => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend = () => setImage(r.result); r.readAsDataURL(f); }}} className="w-full text-xs" />
        <label className="flex items-center gap-2 pt-2 cursor-pointer">
          <input type="checkbox" checked={sharePublic} onChange={e => setSharePublic(e.target.checked)} className="w-4 h-4 rounded text-teal-700" />
          <span className="text-xs font-bold text-slate-700">Dela i globala flödet & på kartan</span>
        </label>
        <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold p-3.5 rounded-xl shadow`}>Spara Fångst</button>
      </form>
    </div>
  );
}

// --- INSTÄLLNINGAR MODAL ---
function SettingsModal({ isOpen, onClose, user, profile, appTheme, setAppTheme, setShowAuthModal, currentTheme, isPro }) {
  const [name, setName] = useState(profile.displayName || '');
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [isAdmin, setIsAdmin] = useState(localStorage.getItem('bitetracker_admin') === 'true');
  const [pendingLakes, setPendingLakes] = useState([]);

  useEffect(() => { setName(profile.displayName || ''); }, [profile]);

  useEffect(() => {
    if (!isAdmin) return;
    db.collection('artifacts').doc(appId).collection('lake_suggestions').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      setPendingLakes(list.filter(l => l.status === 'pending'));
    });
  }, [isAdmin]);

  if (!isOpen) return null;

  const handleSaveName = async (e) => {
    e.preventDefault();
    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').set({ displayName: name }, { merge: true });
    alert("Namn sparat!");
  };

  const handleApproveLake = async (lake) => {
    await db.collection('artifacts').doc(appId).collection('approved_lakes').add({
      name: lake.name, rules: lake.rules, fish: lake.fish, lat: lake.lat, lng: lake.lng, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('artifacts').doc(appId).collection('lake_suggestions').doc(lake.id).delete();
    alert("Sjö godkänd!");
  };

  return (
    <div className="fixed inset-0 bg-black/60 z-[2500] flex items-center justify-center p-4">
      <div className="bg-white p-6 rounded-3xl w-full max-w-sm space-y-4 relative max-h-[85vh] overflow-y-auto">
        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 bg-slate-100 p-1.5 rounded-full"><X className="h-5 w-5"/></button>
        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Settings className="h-5 w-5"/> Inställningar</h2>

        <form onSubmit={handleSaveName} className="space-y-2">
          <label className="text-xs font-bold text-slate-700">Ditt Fiske-Namn</label>
          <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
          <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold py-2.5 rounded-xl text-xs`}>Spara Namn</button>
        </form>

        <div className="space-y-2 pt-2 border-t">
          <label className="text-xs font-bold text-slate-700">Välj Tema</label>
          <div className="grid grid-cols-3 gap-2">
            <button onClick={() => { setAppTheme('blue'); localStorage.setItem('bitetracker_theme', 'blue'); }} className="p-2.5 rounded-xl font-bold text-white bg-blue-900 text-xs">Blå</button>
            <button onClick={() => { setAppTheme('teal'); localStorage.setItem('bitetracker_theme', 'teal'); }} className="p-2.5 rounded-xl font-bold text-white bg-teal-700 text-xs">Grön</button>
            <button onClick={() => { setAppTheme('sunset'); localStorage.setItem('bitetracker_theme', 'sunset'); }} className="p-2.5 rounded-xl font-bold text-white bg-amber-800 text-xs">Solnedgång</button>
          </div>
        </div>

        <div className="pt-2 border-t">
          {!isPro ? (
            <button onClick={() => { onClose(); setShowAuthModal(true); }} className="w-full bg-amber-500 text-white font-bold p-3 rounded-xl text-xs shadow">Logga in för PRO</button>
          ) : (
            <div className="text-center text-xs font-bold text-amber-700 bg-amber-50 p-2.5 rounded-xl flex items-center justify-center gap-1">
              {profile.isOG && <span>🏆 OG Medlem • </span>}✨ PRO Aktiv
            </div>
          )}
        </div>

        {!isAdmin ? (
          <button onClick={() => setShowPinModal(true)} className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-xs">Admin</button>
        ) : (
          <div className="bg-slate-900 text-white p-3 rounded-xl space-y-2 text-xs">
            <p className="font-bold text-amber-400">🛡️ Väntande sjöar:</p>
            {pendingLakes.map(l => (
              <div key={l.id} className="bg-slate-800 p-2 rounded flex justify-between items-center">
                <span>{l.name}</span>
                <button onClick={() => handleApproveLake(l)} className="bg-emerald-600 px-2 py-1 rounded text-[10px] font-bold">Godkänn</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {showPinModal && (
        <div className="fixed inset-0 bg-black/70 z-[3000] flex items-center justify-center p-4">
          <form onSubmit={(e) => { e.preventDefault(); if(pinInput === '6031') {setIsAdmin(true); setShowPinModal(false);} else alert("Fel"); }} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <input type="password" placeholder="Pinkod..." value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-center" />
            <button type="submit" className="w-full bg-slate-900 text-white p-3 rounded-xl font-bold text-sm">Lås upp</button>
          </form>
        </div>
      )}
    </div>
  );
}

function NavItem({ Icon, label, isActive, onClick, currentTheme }) {
  return (
    <button onClick={onClick} className={`flex flex-col items-center justify-center py-1.5 px-3 min-w-[50px] rounded-xl transition ${ isActive ? `${currentTheme.text} ${currentTheme.light} font-bold scale-105` : 'text-slate-400' }`}>
      <Icon className="h-5 w-5 mb-0.5"/> <span className="text-[9px]">{label}</span>
    </button>
  );
}

// --- HUVUDAPPEN ---
function FiskeAppen() {
  const [user, setUser] = useState(null);
  const [isLoadingAuth, setIsLoadingAuth] = useState(true);
  const [activeTab, setActiveTab] = useState('feed');
  const [catches, setCatches] = useState([]);
  const [globalFeed, setGlobalFeed] = useState([]);
  const [lures, setLures] = useState([]);
  const [profile, setProfile] = useState({});
  const [showAuthModal, setShowAuthModal] = useState(false);
  const [showSettingsModal, setShowSettingsModal] = useState(false);
  const [showWelcomeModal, setShowWelcomeModal] = useState(true);
  const [appTheme, setAppTheme] = useState(localStorage.getItem('bitetracker_theme') || 'blue');
  const isPro = user && !user.isAnonymous;

  const t = (key) => translations['sv']?.[key] || key;
  const currentTheme = themes[appTheme] || themes.blue;

  useEffect(() => {
    const initAuth = async () => { try { await auth.signInAnonymously(); } catch (e) {} setIsLoadingAuth(false); };
    initAuth();
    const unsubscribe = auth.onAuthStateChanged((currentUser) => { setUser(currentUser); setIsLoadingAuth(false); });
    return () => unsubscribe();
  }, []);

  // AUTOMATISK KONTROLL FÖR DE 21-25 FÖRSTA (OG-BANNER)
  useEffect(() => {
    if (!user || user.isAnonymous) return;
    const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile');
    
    profileRef.get().then(async doc => {
      const data = doc.exists ? doc.data() : {};
      if (data.isOG === undefined) {
        // Räkna antal registrerade användare
        const usersSnap = await db.collection('artifacts').doc(appId).collection('users').get();
        const isOneOfFirst25 = usersSnap.size <= 25;
        
        await profileRef.set({ isOG: isOneOfFirst25 }, { merge: true });
        setProfile(prev => ({ ...prev, isOG: isOneOfFirst25 }));
      } else {
        setProfile(data);
      }
    });
  }, [user]);

  useEffect(() => {
    if (!user) return;
    const unsubC = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').onSnapshot(snap => {
      const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); f.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)); setCatches(f);
    });
    const unsubG = db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => {
      const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); f.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)); setGlobalFeed(f);
    });
    const unsubL = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').onSnapshot(snap => {
      const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); f.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0)); setLures(f);
    });
    const unsubP = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').onSnapshot(docSnap => {
      if (docSnap.exists) setProfile(prev => ({ ...prev, ...docSnap.data() }));
    });
    return () => { unsubC(); unsubG(); unsubL(); unsubP(); };
  }, [user]);

  if (isLoadingAuth) return <div className="flex h-screen items-center justify-center bg-slate-900 text-white"><h1 className="text-2xl font-black">BiteTracker</h1></div>;

  return (
    <div className="flex flex-col h-screen bg-slate-50 font-sans">
      <header className={`${currentTheme.bg} text-white p-4 shadow-md flex items-center justify-between z-10 shrink-0`}>
        <div className="flex items-center gap-3">
          <img src="179412295382.jpg" alt="Logo" className="h-8 w-8 rounded-lg object-cover" />
          <div className="flex items-center gap-2">
            <h1 className="text-xl font-bold">{t('appTitle')}</h1>
            {isPro && <span className="bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow">PRO</span>}
          </div>
        </div>
        <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-1.5 text-white/90 py-1 px-3 bg-black/20 rounded-xl text-xs font-bold">
          <User className="h-4 w-4"/> {user?.isAnonymous ? 'Logga In' : (profile.displayName || user?.email)}
        </button>
      </header>

      <main className="flex-1 overflow-y-auto pb-20">
        {activeTab === 'feed' && <FeedView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} setShowAuthModal={setShowAuthModal} t={t} user={user}/>}
        {activeTab === 'compete' && <CompetitionView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} t={t} user={user}/>}
        {activeTab === 'ai' && <AIChatView catches={catches} currentTheme={currentTheme} lures={lures} t={t}/>}
        {activeTab === 'map' && <MapView currentTheme={currentTheme} isPro={isPro} user={user}/>}
        {activeTab === 'log' && <CatchLogView currentTheme={currentTheme} profile={profile} t={t} user={user}/>}
        {activeTab === 'profile' && <ProfileView currentTheme={currentTheme} isPro={isPro} profile={profile} setShowAuthModal={setShowAuthModal} user={user} onOpenSettings={() => setShowSettingsModal(true)} catches={catches} lures={lures}/>}
      </main>

      <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 z-20 shadow">
        <div className="flex justify-around items-center p-1.5">
          <NavItem Icon={Compass} isActive={activeTab === 'feed'} label={t('nav_feed')} onClick={() => setActiveTab('feed')} currentTheme={currentTheme} />
          <NavItem Icon={Trophy} isActive={activeTab === 'compete'} label={t('nav_compete')} onClick={() => setActiveTab('compete')} currentTheme={currentTheme} />
          <NavItem Icon={Bot} isActive={activeTab === 'ai'} label={t('nav_ai')} onClick={() => setActiveTab('ai')} currentTheme={currentTheme} />
          <NavItem Icon={MapComponent} isActive={activeTab === 'map'} label={t('nav_map')} onClick={() => setActiveTab('map')} currentTheme={currentTheme} />
          <NavItem Icon={Fish} isActive={activeTab === 'log'} label={t('nav_log')} onClick={() => setActiveTab('log')} currentTheme={currentTheme} />
          <NavItem Icon={User} isActive={activeTab === 'profile'} label={t('nav_profile')} onClick={() => setActiveTab('profile')} currentTheme={currentTheme} />
        </div>
      </nav>

      <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} user={user} currentTheme={currentTheme} />
      <SettingsModal isOpen={showSettingsModal} onClose={() => setShowSettingsModal(false)} user={user} profile={profile} appTheme={appTheme} setAppTheme={setAppTheme} setShowAuthModal={setShowAuthModal} currentTheme={currentTheme} isPro={isPro} />
      <WelcomeProModal isOpen={showWelcomeModal && user?.isAnonymous} onClose={() => setShowWelcomeModal(false)} onLoginClick={() => setShowAuthModal(true)} />
    </div>
  );
}

try {
    const rootElement = document.getElementById('root');
    if (rootElement) createRoot(rootElement).render(<FiskeAppen/>);
} catch (err) { console.error(err); }

const loader = document.getElementById('loading-screen');
if (loader) loader.remove();
</script>
</body>
</html>
