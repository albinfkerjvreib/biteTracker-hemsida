const themes = {

  teal: { bg: 'bg-teal-700', text: 'text-teal-700', light: 'bg-teal-50' },

const getWeatherDetails = (code) => {
  if (code === 0) return { icon: '☀️', text: 'Soligt' };
  if ([1, 2].includes(code)) return { icon: '⛅', text: 'Halvklart' };
  if (code === 3) return { icon: '☁️', text: 'Molnigt' };
  if ([45, 48].includes(code)) return { icon: '🌫️', text: 'Dimma' };
  if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: '🌧️', text: 'Regn' };
  if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: '❄️', text: 'Snö' };
  if ([95, 96, 99].includes(code)) return { icon: '🌩️', text: 'Åska' };
  return { icon: '☀️', text: 'Klart' };
};

function AuthModal({ isOpen, onClose, user, currentTheme, showToast }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [rememberMe, setRememberMe] = useState(true);

  if (!isOpen) return null;

  const setAuthPersistence = async () => {
    const mode = rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(mode);
  };

  const handleGoogle = async () => {
    try {
      await setAuthPersistence();
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithRedirect(provider);
    } catch (err) { showToast("Inloggningsfel: " + err.message); }
  };

  const handleEmail = async (e) => {
    e.preventDefault();
    try {
      await setAuthPersistence();
      if (isSignUp) await auth.createUserWithEmailAndPassword(email, password);
      else await auth.signInWithEmailAndPassword(email, password);
      showToast("Välkommen! Du är nu inloggad i PRO.");
      onClose();
    } catch (err) { showToast("Fel vid inloggning: " + err.message); }
  };

  return (
    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[2000]">
      <div className="bg-white p-6 rounded-3xl w-full max-w-sm space-y-4 relative shadow-2xl max-h-[90vh] overflow-y-auto">
        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 bg-slate-100 p-1.5 rounded-full"><X className="h-5 w-5"/></button>
        {user && !user.isAnonymous ? (
          <div className="space-y-4 text-center py-4">
            <div className="w-16 h-16 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✨</div>
            <h3 className="text-xl font-bold text-slate-800">Du är PRO-medlem!</h3>
            <p className="text-xs text-slate-500">{user.email}</p>
            <button onClick={() => { auth.signOut(); showToast("Du har loggats ut."); onClose(); }} className="w-full bg-slate-100 text-red-600 font-bold p-3 rounded-xl text-sm">Logga ut</button>
          </div>
        ) : (
          <form onSubmit={handleEmail} className="space-y-3">
            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-1.5"><Sparkles className="h-5 w-5 text-amber-500"/> {isSignUp ? 'Skapa PRO-konto' : 'Logga in för PRO'}</h3>
            <button type="button" onClick={handleGoogle} className="w-full bg-white border border-slate-300 text-slate-700 font-bold p-3 rounded-xl text-sm flex items-center justify-center gap-2">🌐 Google</button>
            <input type="email" placeholder="E-post" value={email} onChange={e => setEmail(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <input type="password" placeholder="Lösenord" value={password} onChange={e => setPassword(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            
            <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer py-1">
              <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} className="rounded text-teal-700 focus:ring-teal-500" />
              <span>Behåll mig inloggad tills jag loggar ut</span>
            </label>

            <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold p-3 rounded-xl text-sm`}>{isSignUp ? 'Skapa konto' : 'Logga in'}</button>
            <ProBenefitsList />
            <div className="text-center pt-1"><button type="button" onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-blue-600 font-semibold">{isSignUp ? 'Har du konto? Logga in' : 'Skapa konto gratis'}</button></div>
          </form>
        )}
      </div>
    </div>
  );
}

// --- FLÖDE ---
function FeedView({ globalFeed, user, t, currentTheme, isPro, setShowAuthModal, showToast, isAdmin }) {
  const [weather, setWeather] = useState(null);
  const [dailyForecast, setDailyForecast] = useState([]);
  const [locationLabel, setLocationLabel] = useState('Stockholm');

  useEffect(() => {
    const fetchWeather = async (lat = 59.3293, lng = 18.0686, label = 'Stockholm') => {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&wind_speed_unit=ms&timezone=Europe%2FStockholm`);
        const data = await res.json();
        
        if (data && data.current_weather) {
          const currDetails = getWeatherDetails(data.current_weather.weathercode);
          setWeather({ 
            temp: Math.round(data.current_weather.temperature), 
            wind: (data.current_weather.windspeed).toFixed(1),
            icon: currDetails.icon,
            text: currDetails.text
          });
        }

        if (data && data.daily && data.daily.time) {
          const days = data.daily.time.map((tStr, idx) => {
            const d = new Date(tStr);
            const dayName = d.toLocaleDateString('sv-SE', { weekday: 'short' });
            const wCode = data.daily.weathercode ? data.daily.weathercode[idx] : 0;
            const wDetails = getWeatherDetails(wCode);
            const windVal = data.daily.wind_speed_10m_max ? data.daily.wind_speed_10m_max[idx] : (data.daily.windspeed_10m_max ? data.daily.windspeed_10m_max[idx] : 3.5);

            return {
              day: dayName.charAt(0).toUpperCase() + dayName.slice(1),
              maxTemp: Math.round(data.daily.temperature_2m_max[idx]),
              minTemp: Math.round(data.daily.temperature_2m_min[idx]),
              wind: Math.round(windVal),
              icon: wDetails.icon,
              text: wDetails.text
            };
          });
          setDailyForecast(days);
        }
      } catch (err) { 
        setWeather({ temp: 15, wind: "3.5", icon: '☀️', text: 'Soligt' }); 
      }
    };

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setLocationLabel("Din plats");
          fetchWeather(pos.coords.latitude, pos.coords.longitude, "Din plats");
        },
        () => { fetchWeather(59.3293, 18.0686, "Stockholm"); }
      );
    } else { fetchWeather(59.3293, 18.0686, "Stockholm"); }
  }, []);

  const handleLike = async (post) => {
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    const ref = db.collection('artifacts').doc(appId).collection('public_feed').doc(post.id);
    const likes = post.likes || [];
    if (likes.includes(user.uid)) await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(user.uid) });
    else await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(user.uid) });
  };

  const handleDeletePost = async (postId) => {
    await db.collection('artifacts').doc(appId).collection('public_feed').doc(postId).delete();
    showToast("🗑️ Inlägg borttaget från flödet!");
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      {!isPro && (
        <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
          <div>
            <h3 className="font-bold text-sm">✨ Lås upp BiteTracker PRO</h3>
            <p className="text-xs text-amber-100">Få 7-dagars väderprognos & permanent sparande!</p>
          </div>
          <button onClick={() => setShowAuthModal(true)} className="bg-white text-amber-900 font-bold px-4 py-2 rounded-xl text-xs shadow">Logga In</button>
        </div>
      )}

      {/* VÄDERKORT */}
      <div className="bg-gradient-to-br from-teal-800 to-slate-900 text-white p-4 rounded-2xl shadow-sm space-y-3">
        <div className="flex items-center justify-between border-b border-teal-700/50 pb-3">
          <div>
            <span className="text-[10px] text-teal-300 font-black tracking-wider">SVENSKT VÄDER & NAPPINDEX ({locationLabel.toUpperCase()})</span>
            <h3 className="font-bold text-lg flex items-center gap-1.5">
              <span>{weather ? weather.icon : '☀️'}</span> 
              <span>{weather ? `${weather.temp}°C` : '15°C'}</span> 
              <span className="text-xs text-teal-200 font-normal">({weather ? weather.text : 'Soligt'})</span>
              <span className="text-xs text-slate-300 ml-1">• Vind {weather ? `${weather.wind} m/s` : '3.5 m/s'}</span>
            </h3>
          </div>
          <div className="bg-amber-400 text-slate-900 font-black px-3 py-2 rounded-xl text-center text-xs shadow">
            <span>🔥 Nappindex</span>
            <span className="block text-sm">8/10</span>
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between text-xs mb-2">
            <span className="font-bold text-teal-200 flex items-center gap-1"><CalendarIcon className="h-3.5 w-3.5"/> 7-Dagars Svensk Prognos</span>
            {isPro ? <span className="text-[10px] bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">PRO Aktiv</span> : <span className="text-[10px] text-slate-400">Logga in för PRO</span>}
          </div>

          {isPro ? (
            <div className="flex gap-2 overflow-x-auto no-scrollbar pt-1 pb-1">
              {dailyForecast.map((df, i) => (
                <div key={i} className="bg-slate-800/80 border border-teal-600/30 p-2.5 rounded-xl min-w-[75px] text-center shrink-0">
                  <span className="text-[10px] font-bold text-slate-300 block">{df.day}</span>
                  <span className="text-lg block my-0.5">{df.icon}</span>
                  <span className="text-xs font-black text-white block">{df.maxTemp}°</span>
                  <span className="text-[9px] text-teal-300 block font-medium">{df.wind} m/s</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="bg-slate-800/60 p-3 rounded-xl text-center text-xs text-slate-300 space-y-1 border border-slate-700">
              <p>🔒 <b>7-dagars väderprognos kräver PRO-konto.</b></p>
              <button onClick={() => setShowAuthModal(true)} className="text-amber-300 font-bold underline text-[11px]">Logga in gratis här</button>
            </div>
          )}
        </div>
      </div>

      <div className="space-y-4">
        {globalFeed.map(post => {
          const likesCount = (post.likes || []).length;
          const hasLiked = user && !user.isAnonymous && (post.likes || []).includes(user.uid);
          const isOwner = user && !user.isAnonymous && post.authorUid === user.uid;

          return (
            <div key={post.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden relative">
              <div className="p-4 flex items-center justify-between border-b">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-xs overflow-hidden">
                    {post.avatar ? <img src={post.avatar} className="w-full h-full object-cover"/> : (post.authorName?.charAt(0) || 'F')}
                  </div>
                  <div><span className="font-bold text-sm flex items-center gap-1">{post.authorName || 'Fiskare'} {post.isOG && <span className="bg-amber-400 text-slate-900 text-[9px] font-black px-1.5 py-0.2 rounded-full">🏆 OG</span>}</span><span className="text-[10px] text-slate-400">{post.location}</span></div>
                </div>
                
                <div className="flex items-center gap-2">
                  <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">{post.species}</span>
                  {(isAdmin || isOwner) && (
                    <button onClick={() => handleDeletePost(post.id)} className="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded-lg border border-red-200 transition">
                      🗑️ {isAdmin ? 'Admin Ta bort' : 'Ta bort'}
                    </button>
                  )}
                </div>
              </div>
              {post.image && <img src={post.image} alt={post.species} className="w-full h-64 object-cover" />}
              <div className="p-4 space-y-2">
                <p className="text-sm font-semibold">⚖️ {post.weight} kg {post.length ? `• 📏 ${post.length} cm` : ''} {post.lure ? `• 🎣 ${post.lure}` : ''}</p>
                {post.description && <p className="text-xs text-slate-600">"{post.description}"</p>}
                <button onClick={() => handleLike(post)} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-xl ${hasLiked ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-600'}`}><Heart className={`h-4 w-4 ${hasLiked ? 'fill-red-500 text-red-500' : ''}`}/> {likesCount}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CompetitionView({ globalFeed, user, t, currentTheme, isPro, catches, showToast }) {
  const [competitions, setCompetitions] = useState([]);
  const [showCreateModal, setShowCreateModal] = useState(false);
  const [showSubmitModal, setShowSubmitModal] = useState(false);
  const [selectedComp, setSelectedComp] = useState(null);
  const [selectedCatchId, setSelectedCatchId] = useState('');

  const [compTitle, setCompTitle] = useState('');
  const [compTarget, setCompTarget] = useState('Gädda');
  const [compType, setCompType] = useState('weight');
  const [compDuration, setCompDuration] = useState('7');
  const [joinCode, setJoinCode] = useState('');

  useEffect(() => {
    db.collection('artifacts').doc(appId).collection('competitions').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() })); setCompetitions(list);
    });
  }, []);

  const handleCreateComp = async (e) => {
    e.preventDefault();
    if (!compTitle) return;
    const expiresAt = Date.now() + parseInt(compDuration) * 24 * 60 * 60 * 1000;
    await db.collection('artifacts').doc(appId).collection('competitions').add({
      title: compTitle, target: compTarget, type: compType, expiresAt,
      creator: user?.email || 'Fiskare',
      code: Math.random().toString(36).substring(2, 8).toUpperCase(),
      participants: [user?.uid || 'guest'],
      submissions: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setShowCreateModal(false); setCompTitle('');
    showToast("Tävling skapad!");
  };

  const handleJoinComp = async (e) => {
    e.preventDefault();
    if (!joinCode) return;
    const snap = await db.collection('artifacts').doc(appId).collection('competitions').where('code', '==', joinCode.toUpperCase()).get();
    if (snap.empty) showToast("Hittade ingen tävling med den koden.");
    else {
      const doc = snap.docs[0];
      await doc.ref.update({ participants: firebase.firestore.FieldValue.arrayUnion(user?.uid || 'guest') });
      showToast(`Gick med i ${doc.data().title}!`);
      setJoinCode('');
    }
  };

  const handleSubmitCatch = async (e) => {
    e.preventDefault();
    if (!selectedComp || !selectedCatchId) return;
    const chosenCatch = catches.find(c => c.id === selectedCatchId);
    if (!chosenCatch) return;

    const submission = {
      userId: user.uid,
      userName: user.email || 'Fiskare',
      species: chosenCatch.species,
      value: selectedComp.type === 'weight' ? chosenCatch.weight : (chosenCatch.length || 0),
      lure: chosenCatch.lure || 'Okänt',
      date: new Date().toLocaleDateString()
    };

    const compRef = db.collection('artifacts').doc(appId).collection('competitions').doc(selectedComp.id);
    const existing = selectedComp.submissions || [];
    const filtered = existing.filter(s => s.userId !== user.uid);
    filtered.push(submission);

    await compRef.update({ submissions: filtered });
    setShowSubmitModal(false); setSelectedComp(null); setSelectedCatchId('');
    showToast("✅ Bidrag inskickat till tävlingen!");
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      <div className="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between">
        <div><h2 className={`text-xl font-bold ${currentTheme.text} flex items-center gap-2`}><Trophy className="h-6 w-6 text-amber-500"/> Tävlingar</h2><p className="text-xs text-slate-500">Största eller längsta fisken</p></div>
        <button onClick={() => { if(!isPro){showToast("Tävlingar kräver PRO-konto!"); return;} setShowCreateModal(true); }} className={`${currentTheme.bg} text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow`}>+ Skapa Privat</button>
      </div>

      <form onSubmit={handleJoinComp} className="bg-white p-4 rounded-2xl shadow-sm border flex gap-2">
        <input type="text" placeholder="Inbjudningskod..." value={joinCode} onChange={e => setJoinCode(e.target.value)} className="flex-1 p-3 bg-slate-50 border rounded-xl text-sm uppercase" />
        <button type="submit" className="bg-amber-600 text-white font-bold px-4 rounded-xl text-xs shadow">Gå med</button>
      </form>

      {competitions.map(c => {
        const isExpired = Date.now() > c.expiresAt;
        const subs = c.submissions || [];
        subs.sort((a, b) => b.value - a.value);
        const winner = subs.length > 0 ? subs[0] : null;

        return (
          <div key={c.id} className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
            <div className="flex justify-between items-start">
              <div>
                <h3 className="font-bold text-slate-800 text-base">🏆 {c.title}</h3>
                <p className="text-[10px] text-slate-500">Mål: {c.target} • Typ: {c.type === 'weight' ? 'Största (kg)' : 'Längsta (cm)'}</p>
                <p className={`text-[10px] font-bold mt-1 ${isExpired ? 'text-red-600' : 'text-emerald-600'}`}>
                  {isExpired ? '🏁 Tävlingen är avslutad!' : `⏰ Tid kvar: ${Math.ceil((c.expiresAt - Date.now()) / (1000*60*60*24))} dagar`}
                </p>
              </div>
              <span className="bg-amber-100 text-amber-800 text-xs font-black px-2.5 py-1 rounded-lg">{c.code}</span>
            </div>

            {isExpired && winner && (
              <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center space-y-1">
                <span className="text-amber-800 font-bold text-xs block">🥇 VINNARE AV TÄVLINGEN!</span>
                <p className="text-sm font-black text-slate-800">{winner.userName} ({winner.value} {c.type === 'weight' ? 'kg' : 'cm'} {winner.species})</p>
              </div>
            )}

            <div className="space-y-1 pt-2 border-t">
              <p className="text-xs font-bold text-slate-500">Ställning:</p>
              {subs.length === 0 ? <p className="text-xs text-slate-400">Inga bidrag ännu.</p> : subs.map((s, idx) => (
                <div key={idx} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg">
                  <span>#{idx+1} {s.userName}</span>
                  <span className="font-bold text-emerald-700">{s.value} {c.type === 'weight' ? 'kg' : 'cm'}</span>
                </div>
              ))}
            </div>

            {!isExpired && user && !user.isAnonymous && (
              <button onClick={() => { setSelectedComp(c); setShowSubmitModal(true); }} className="w-full bg-teal-700 text-white font-bold py-2 rounded-xl text-xs shadow">
                📤 Skicka in bidrag från dina fångster
              </button>
            )}
          </div>
        );
      })}

      {showCreateModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={handleCreateComp} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg text-slate-800">Skapa Tävling</h3>
            <input type="text" placeholder="Tävlingsnamn" value={compTitle} onChange={e => setCompTitle(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <select value={compTarget} onChange={e => setCompTarget(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
              <option value="Gädda">Gädda</option><option value="Abborre">Abborre</option><option value="Gös">Gös</option>
            </select>
            <select value={compType} onChange={e => setCompType(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
              <option value="weight">Största fisken (Vikt)</option><option value="length">Längsta fisken (Längd)</option>
            </select>
            <select value={compDuration} onChange={e => setCompDuration(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
              <option value="1">1 dag</option><option value="3">3 dagar</option><option value="7">7 dagar</option><option value="30">30 dagar</option>
            </select>
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowCreateModal(false)} className="flex-1 bg-slate-100 p-3 rounded-xl text-sm font-bold">Avbryt</button>
              <button type="submit" className="flex-1 bg-amber-600 text-white p-3 rounded-xl text-sm font-bold shadow">Skapa</button>
            </div>
          </form>
        </div>
      )}

      {showSubmitModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={handleSubmitCatch} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg text-slate-800">Välj fångst</h3>
            {catches.length === 0 ? <p className="text-xs text-slate-500">Inga sparade fångster.</p> : (
              <select value={selectedCatchId} onChange={e => setSelectedCatchId(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm">
                <option value="">-- Välj fångst --</option>
                {catches.map(c => <option key={c.id} value={c.id}>{c.species} - {c.weight} kg</option>)}
              </select>
            )}
            <div className="flex gap-2">
              <button type="button" onClick={() => setShowSubmitModal(false)} className="flex-1 bg-slate-100 p-3 rounded-xl text-xs font-bold">Avbryt</button>
              <button type="submit" className="flex-1 bg-teal-700 text-white p-3 rounded-xl text-xs font-bold shadow">Skicka in</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// --- PROFIL ---
function ProfileView({ user, profile, currentTheme, isPro, setShowAuthModal, onOpenSettings, catches, lures, showToast }) {
  const [bio, setBio] = useState(profile.bio || '');
  const [lureName, setLureName] = useState('');
  const [lureType, setLureType] = useState('');
  const [lureColor, setLureColor] = useState('');

  useEffect(() => { setBio(profile.bio || ''); }, [profile]);

  const handleSaveBio = async (e) => {
    e.preventDefault();
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').set({ bio }, { merge: true });
    showToast("Fiske-beskrivning sparad!");
  };

  const handleAvatarChange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    const reader = new FileReader();
    reader.onloadend = async () => {
      const base64Image = reader.result;
      await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').set({ avatar: base64Image }, { merge: true });
      showToast("Profilbild uppdaterad!");
    };
    reader.readAsDataURL(file);
  };

  const handleDeleteCatch = async (catchId) => {
    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').doc(catchId).delete();
    showToast("🗑️ Fångst borttagen!");
  };

  const handleDeleteLure = async (lureId) => {
    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').doc(lureId).delete();
    showToast("Bete borttaget!");
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto pb-10">
      <div className="bg-white p-5 rounded-2xl shadow-sm border text-center space-y-3 relative">
        <button onClick={onOpenSettings} className="absolute top-4 right-4 bg-slate-100 hover:bg-slate-200 p-2 rounded-full text-slate-700 shadow-sm transition">
          <Settings className="h-5 w-5"/>
        </button>

        <div className="relative w-24 h-24 mx-auto group pt-2">
          {profile.avatar ? (
            <img src={profile.avatar} alt="Profilbild" className="w-24 h-24 rounded-full object-cover shadow border-2 border-teal-700" />
          ) : (
            <div className="w-24 h-24 bg-teal-100 text-teal-800 rounded-full flex items-center justify-center text-3xl font-black shadow border-2 border-teal-700">
              {profile.displayName ? profile.displayName.charAt(0) : '👤'}
            </div>
          )}
          <label className="absolute bottom-0 right-0 bg-teal-700 text-white p-1.5 rounded-full cursor-pointer shadow hover:bg-teal-800 text-xs">
            📷<input type="file" accept="image/*" onChange={handleAvatarChange} className="hidden" />
          </label>
        </div>

        <h2 className={`text-xl font-bold ${currentTheme.text} flex items-center justify-center gap-1.5`}>
          {profile.displayName || 'Inloggad Fiskare'}
          {profile.isOG && <span className="bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded-full shadow">🏆 OG Medlem</span>}
        </h2>
        <p className="text-xs text-slate-500">{user?.email || 'Gäst-konto'}</p>
        
        {isPro ? (
          <span className="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full"><Sparkles className="inline h-3 w-3"/> PRO Medlem Aktiv</span>
        ) : (
          <button onClick={() => setShowAuthModal(true)} className="bg-amber-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow">Logga in för PRO</button>
        )}

        <form onSubmit={handleSaveBio} className="pt-2 text-left space-y-2 border-t mt-4">
          <label className="text-xs font-bold text-slate-700">Om mig / Fiske-beskrivning</label>
          <textarea value={bio} onChange={e => setBio(e.target.value)} placeholder="Skriv lite om dig själv..." className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none h-16 resize-none" />
          <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold py-2 rounded-xl text-xs shadow`}>Spara Beskrivning</button>
        </form>
      </div>

      <div className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5"><Package className="h-5 w-5 text-teal-700"/> Min Beteslåda ({lures.length})</h3>
        <form onSubmit={async (e) => {
          e.preventDefault(); if (!lureName) return;
          await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').add({ name: lureName, type: lureType, color: lureColor, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          setLureName(''); setLureType(''); setLureColor(''); showToast("Bete tillagt i lådan!");
        }} className="space-y-2">
          <input type="text" placeholder="Betets namn..." value={lureName} onChange={e => setLureName(e.target.value)} required className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
          <div className="grid grid-cols-2 gap-2">
            <input type="text" placeholder="Typ" value={lureType} onChange={e => setLureType(e.target.value)} className="p-2.5 bg-slate-50 border rounded-xl text-xs" />
            <input type="text" placeholder="Färg" value={lureColor} onChange={e => setLureColor(e.target.value)} className="p-2.5 bg-slate-50 border rounded-xl text-xs" />
          </div>
          <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold py-2 rounded-xl text-xs shadow`}>+ Lägg till</button>
        </form>
        
        {lures.length > 0 && (
          <div className="space-y-1.5 pt-2 border-t">
            {lures.map(l => (
              <div key={l.id} className="flex justify-between items-center bg-slate-50 p-2 rounded-xl text-xs border">
                <span><b>🎣 {l.name}</b> {l.type ? `(${l.type})` : ''} {l.color ? `• ${l.color}` : ''}</span>
                <button onClick={() => handleDeleteLure(l.id)} className="text-red-500 font-bold px-2 py-0.5 hover:bg-red-50 rounded">✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5"><Fish className="h-5 w-5 text-teal-700"/> Dina Fångster ({catches.length})</h3>
        {catches.length === 0 ? (
          <p className="text-xs text-slate-400">Inga sparade fångster ännu.</p>
        ) : catches.map(c => (
          <div key={c.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border text-xs gap-3">
            <div className="flex items-center gap-3 overflow-hidden">
              {c.image ? (
                <img src={c.image} alt={c.species} className="w-12 h-12 rounded-lg object-cover border shrink-0" />
              ) : (
                <div className="w-12 h-12 rounded-lg bg-teal-100 text-teal-800 flex items-center justify-center font-bold text-lg shrink-0">🐟</div>
              )}
              <div className="truncate">
                <p className="font-bold text-slate-800 text-sm truncate">🐟 {c.species}</p>
                <p className="text-[10px] text-slate-500 truncate">{c.location} {c.lure ? `• 🎣 ${c.lure}` : ''}</p>
                {c.description && <p className="text-[11px] text-slate-600 italic truncate">"{c.description}"</p>}
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <span className="font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">{c.weight} kg</span>
              <button onClick={() => handleDeleteCatch(c.id)} className="text-red-500 bg-red-50 hover:bg-red-100 p-1.5 rounded-lg font-bold border border-red-200">🗑️</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// --- KARTA MED SÖKFUNKTION ---
function MapView({ user, currentTheme, isPro, showToast }) {
  const [leafletLoaded, setLeafletLoaded] = useState(false);
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersLayer = useRef(null);
  const tileLayerRef = useRef(null);

  const [mapStyle, setMapStyle] = useState('topo');
  const [searchQuery, setSearchQuery] = useState('');
  const [approvedLakes, setApprovedLakes] = useState([]);
  const [privateMarkers, setPrivateMarkers] = useState([]);
  const [globalCatches, setGlobalCatches] = useState([]);

  const [showLakes, setShowLakes] = useState(true);
  const [showPrivate, setShowPrivate] = useState(true);
  const [showCatches, setShowCatches] = useState(true);

  const [clickedCoords, setClickedCoords] = useState(null);
  const [showSuggestModal, setShowSuggestModal] = useState(false);
  const [showPrivateModal, setShowPrivateModal] = useState(false);

  const [suggestName, setSuggestName] = useState('');
  const [suggestRules, setSuggestRules] = useState('');
  const [suggestFish, setSuggestFish] = useState('');
  const [privateTitle, setPrivateTitle] = useState('');

  useEffect(() => {
    db.collection('artifacts').doc(appId).collection('approved_lakes').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setApprovedLakes(l); });
    db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setGlobalCatches(l); });
  }, []);

  useEffect(() => {
    if (!user || user.isAnonymous) return;
    db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('private_pins').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setPrivateMarkers(l); });
  }, [user]);

  useEffect(() => {
    if (window.L) { setLeafletLoaded(true); return; }
    const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(link);
    const script = document.createElement('script'); script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; script.onload = () => setLeafletLoaded(true); document.head.appendChild(script);
  }, []);

  useEffect(() => {
    if (!leafletLoaded || !mapRef.current || mapInstance.current) return;
    const map = window.L.map(mapRef.current, { zoomControl: false, tap: true }).setView([60.128, 18.643], 5);
    tileLayerRef.current = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);
    window.L.control.zoom({ position: 'bottomright' }).addTo(map);

    map.on('click', (e) => setClickedCoords({ lat: e.latlng.lat, lng: e.latlng.lng }));
    mapInstance.current = map;
    markersLayer.current = window.L.layerGroup().addTo(map);
  }, [leafletLoaded]);

  const changeMapStyle = (style) => {
    setMapStyle(style);
    if (!mapInstance.current || !window.L) return;
    if (tileLayerRef.current) mapInstance.current.removeLayer(tileLayerRef.current);

    let url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
    if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
    if (style === 'depth') url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';

    tileLayerRef.current = window.L.tileLayer(url).addTo(mapInstance.current);
  };

  const handleSearchPlace = async (e) => {
    e.preventDefault();
    if (!searchQuery.trim()) return;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);
        if (mapInstance.current) {
          mapInstance.current.setView([lat, lon], 12);
        }
        showToast(`📍 Flyttade kartan till: ${data[0].display_name.split(',')[0]}`);
      } else {
        showToast("Kunde inte hitta platsen på kartan.");
      }
    } catch (err) {
      showToast("Fel vid platssökning.");
    }
  };

  useEffect(() => {
    if (!mapInstance.current || !markersLayer.current || !window.L) return;
    markersLayer.current.clearLayers();

    const lakeIcon = window.L.divIcon({ className: 'custom-map-icon bg-teal-700 text-white w-8 h-8', html: '🌊', iconSize: [32, 32], iconAnchor: [16, 16] });
    const catchIcon = window.L.divIcon({ className: 'custom-map-icon bg-emerald-600 text-white w-8 h-8', html: '🐟', iconSize: [32, 32], iconAnchor: [16, 16] });
    const privateIcon = window.L.divIcon({ className: 'custom-map-icon bg-amber-600 text-white w-8 h-8', html: '🔒', iconSize: [32, 32], iconAnchor: [16, 16] });

    if (showLakes) {
      approvedLakes.forEach(l => {
        if (l.lat && l.lng) window.L.marker([l.lat, l.lng], { icon: lakeIcon }).addTo(markersLayer.current).bindPopup(`<b>🌊 ${l.name}</b><br><span style="font-size:11px;">Fisk: ${l.fish || 'Alla'}</span><br><span style="font-size:10px;color:#666;">${l.rules}</span>`);
      });
    }
    if (showPrivate && isPro) {
      privateMarkers.forEach(p => {
        if (p.lat && p.lng) window.L.marker([p.lat, p.lng], { icon: privateIcon }).addTo(markersLayer.current).bindPopup(`<b>🔒 ${p.title}</b>`);
      });
    }
    if (showCatches) {
      globalCatches.forEach(c => {
        if (c.lat && c.lng) {
          const imgHtml = c.image ? `<img src="${c.image}" style="width:100%;height:80px;object-fit:cover;border-radius:8px;margin-top:4px;" />` : '';
          window.L.marker([c.lat, c.lng], { icon: catchIcon }).addTo(markersLayer.current).bindPopup(`<b>🐟 ${c.species} (${c.weight} kg)</b><br><span style="font-size:11px;">${c.location || ''}</span>${imgHtml}`);
        }
      });
    }
  }, [approvedLakes, privateMarkers, globalCatches, showLakes, showPrivate, showCatches, isPro, leafletLoaded]);

  return (
    <div className="relative w-full h-[calc(100vh-140px)]">
      <div className="absolute top-4 left-4 right-4 z-[400] max-w-xl mx-auto space-y-2">
        {/* SÖKFÄLT FÖR STORA KARTAN */}
        <form onSubmit={handleSearchPlace} className="flex gap-1.5 bg-white/95 backdrop-blur-md p-1.5 rounded-2xl shadow-lg border">
          <input 
            type="text" 
            placeholder="🔍 Sök plats eller sjö (t.ex. Vättern)..." 
            value={searchQuery} 
            onChange={e => setSearchQuery(e.target.value)} 
            className="flex-1 px-3 py-1.5 bg-slate-100 rounded-xl text-xs outline-none font-medium"
          />
          <button type="submit" className="bg-teal-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow hover:bg-teal-800 transition">
            Sök
          </button>
        </form>

        <div className="flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-lg border text-xs font-bold">
          <button onClick={() => setShowLakes(!showLakes)} className={`flex-1 py-1 rounded-xl ${showLakes ? 'bg-teal-700 text-white' : 'bg-slate-100'}`}>🌊 Sjöar</button>

// --- LOGGA FÅNGST MED SÖK PÅ MINIKARTAN ---
function CatchLogView({ user, t, currentTheme, profile, showToast }) {
  const [species, setSpecies] = useState('');
  const [weight, setWeight] = useState('');
  const [length, setLength] = useState('');
  const [lure, setLure] = useState('');
  const [description, setDescription] = useState('');
  const [image, setImage] = useState(null);
  const [location, setLocation] = useState('');
  const [coords, setCoords] = useState({ lat: 59.3293, lng: 18.0686 });

  const miniMapRef = useRef(null);
  const miniMapInstance = useRef(null);
  const miniMarkerRef = useRef(null);

  useEffect(() => {
    if (!window.L || !miniMapRef.current || miniMapInstance.current) return;
    const map = window.L.map(miniMapRef.current, { zoomControl: false, attributionControl: false }).setView([coords.lat, coords.lng], 10);
    window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);

    const marker = window.L.marker([coords.lat, coords.lng], { draggable: true }).addTo(map);
    marker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      setCoords({ lat: pos.lat, lng: pos.lng });
    });
    map.on('click', (e) => {
      marker.setLatLng(e.latlng);
      setCoords({ lat: e.latlng.lat, lng: e.latlng.lng });
    });

    miniMapInstance.current = map;
    miniMarkerRef.current = marker;
  }, []);

  const handleSearchMiniMap = async () => {
    if (!location.trim()) return;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        setCoords({ lat, lng });
        if (miniMapInstance.current) {
          miniMapInstance.current.setView([lat, lng], 12);
        }
        if (miniMarkerRef.current) {
          miniMarkerRef.current.setLatLng([lat, lng]);
        }
        showToast(`📍 Minikartan flyttad till: ${data[0].display_name.split(',')[0]}`);
      } else {
        showToast("Hittade inte platsen på kartan.");
      }
    } catch (err) {
      showToast("Fel vid sökning.");
    }
  };

  const handleSave = async (e) => {
    e.preventDefault();
    if (!species || !weight || !location) return;
    try {
      const data = {
        species, weight: parseFloat(weight), length: length ? parseFloat(length) : null,
        lure, description, image, location, lat: coords.lat, lng: coords.lng,
        authorName: profile.displayName || 'Fiskare', isOG: profile.isOG || false,
        authorUid: user.uid, avatar: profile.avatar || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').add(data);
      await db.collection('artifacts').doc(appId).collection('public_feed').add(data);
      setSpecies(''); setWeight(''); setLength(''); setLure(''); setDescription(''); setImage(null); setLocation('');
      showToast("✅ Din fångst har sparats och publicerats i flödet!");
    } catch(err) { showToast("Fel vid sparande av fångst."); }
  };

  return (
    <div className="p-4 max-w-xl mx-auto space-y-4 pb-10">
      <div className="bg-white p-4 rounded-2xl shadow-sm border"><h2 className={`text-xl font-bold ${currentTheme.text}`}>Logga Fångst</h2></div>
      <form onSubmit={handleSave} className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <input type="text" placeholder="Fiskart (t.ex. Gädda)" value={species} onChange={e => setSpecies(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        <div className="grid grid-cols-2 gap-2">
          <input type="number" step="0.1" placeholder="Vikt (kg)" value={weight} onChange={e => setWeight(e.target.value)} required className="p-3 bg-slate-50 border rounded-xl text-sm" />
          <input type="number" placeholder="Längd (cm)" value={length} onChange={e => setLength(e.target.value)} className="p-3 bg-slate-50 border rounded-xl text-sm" />
        </div>
        <input type="text" placeholder="Bete / Drag" value={lure} onChange={e => setLure(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        
        {/* PLATS MED SÖK-KNAPP */}
        <div className="space-y-1">
          <label className="text-xs font-bold text-slate-700">Plats / Sjö:</label>
          <div className="flex gap-2">
            <input type="text" placeholder="Sök eller skriv plats..." value={location} onChange={e => setLocation(e.target.value)} required className="flex-1 p-3 bg-slate-50 border rounded-xl text-sm" />
            <button type="button" onClick={handleSearchMiniMap} className="bg-teal-700 text-white font-bold px-3 py-2 rounded-xl text-xs shadow hover:bg-teal-800 shrink-0">🔍 Sök plats</button>
          </div>
        </div>

        <div className="space-y-1">
          <label className="text-xs font-bold text-slate-700">Placera ut markören på minikartan (drag/klicka):</label>
          <div ref={miniMapRef} className="w-full h-40 rounded-xl border shadow-inner z-0" />
        </div>

        <textarea placeholder="Beskrivning..." value={description} onChange={e => setDescription(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-20 resize-none" />
        <input type="file" accept="image/*" onChange={e => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend = () => setImage(r.result); r.readAsDataURL(f); }}} className="w-full text-xs" />
        <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold p-3.5 rounded-xl shadow`}>Spara Fångst</button>
      </form>
    </div>
  );
}

      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() }));
      setPendingLakes(list.filter(l => l.status === 'pending'));

      if (!currentUser) {
        auth.signInAnonymously().catch(err => console.error(err));
      } else {
        setUser(currentUser);
        setIsLoadingAuth(false);
      }
    });
    return () => unsubscribe();
  }, []);

  useEffect(() => {
    if (!user || user.isAnonymous) return;
    const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile');
    profileRef.get().then(async doc => {
      const data = doc.exists ? doc.data() : {};
      if (data.isOG === undefined) {
        const usersSnap = await db.collection('artifacts').doc(appId).collection('users').get();
        const isOG = usersSnap.size <= 25;
        await profileRef.set({ isOG }, { merge: true });
        setProfile(prev => ({ ...prev, isOG }));
      } else { setProfile(data); }
    });
  }, [user]);

  useEffect(() => {
    if (!user) return;
    const unsubC = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setCatches(f); });
    const unsubG = db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setGlobalFeed(f); });
    const unsubL = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setLures(f); });
    const unsubP = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').onSnapshot(docSnap => { if (docSnap.exists) setProfile(prev => ({ ...prev, ...docSnap.data() })); });
    return () => { unsubC(); unsubG(); unsubL(); unsubP(); };
  }, [user]);

  if (isLoadingAuth) return <div className="flex h-screen items-center justify-center bg-slate-900 text-white"><h1 className="text-2xl font-black">BiteTracker Pro</h1></div>;

  return (
    <div className="flex flex-col h-screen bg-slate-50 font-sans">
      <header className={`${currentTheme.bg} text-white p-4 shadow-md flex items-center justify-between z-10 shrink-0`}>
        <div className="flex items-center gap-3">
          <img src="179412295382.jpg" alt="Logo" className="h-8 w-8 rounded-lg object-cover" />
          <h1 className="text-xl font-bold">{t('appTitle')}</h1>
        </div>
        <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-1.5 text-white/90 py-1 px-3 bg-black/20 rounded-xl text-xs font-bold">
          <User className="h-4 w-4"/> {user?.isAnonymous ? 'Logga In' : (profile.displayName || user?.email)}
        </button>
      </header>

      <main className="flex-1 overflow-y-auto pb-20">
        {activeTab === 'feed' && <FeedView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} setShowAuthModal={setShowAuthModal} showToast={showToast} t={t} user={user} isAdmin={isAdmin}/>}
        {activeTab === 'compete' && <CompetitionView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} showToast={showToast} t={t} user={user} catches={catches}/>}
        {activeTab === 'map' && <MapView currentTheme={currentTheme} isPro={isPro} showToast={showToast} user={user}/>}
        {activeTab === 'log' && <CatchLogView currentTheme={currentTheme} profile={profile} showToast={showToast} t={t} user={user}/>}
        {activeTab === 'profile' && <ProfileView currentTheme={currentTheme} isPro={isPro} profile={profile} setShowAuthModal={setShowAuthModal} showToast={showToast} user={user} onOpenSettings={() => setShowSettingsModal(true)} catches={catches} lures={lures}/>}
      </main>

      <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 z-20 shadow">
        <div className="flex justify-around items-center p-1.5">
          <NavItem Icon={Compass} isActive={activeTab === 'feed'} label={t('nav_feed')} onClick={() => setActiveTab('feed')} currentTheme={currentTheme} />
          <NavItem Icon={Trophy} isActive={activeTab === 'compete'} label="Tävling" onClick={() => setActiveTab('compete')} currentTheme={currentTheme} />
          <NavItem Icon={MapComponent} isActive={activeTab === 'map'} label={t('nav_map')} onClick={() => setActiveTab('map')} currentTheme={currentTheme} />
          <NavItem Icon={Fish} isActive={activeTab === 'log'} label={t('nav_log')} onClick={() => setActiveTab('log')} currentTheme={currentTheme} />
          <NavItem Icon={User} isActive={activeTab === 'profile'} label={t('nav_profile')} onClick={() => setActiveTab('profile')} currentTheme={currentTheme} />
        </div>
      </nav>

      <ToastNotification toast={toast} />

      <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} user={user} currentTheme={currentTheme} showToast={showToast} />
      <SettingsModal isOpen={showSettingsModal} onClose={() => setShowSettingsModal(false)} user={user} profile={profile} appTheme={appTheme} setAppTheme={setAppTheme} setShowAuthModal={setShowAuthModal} currentTheme={currentTheme} isPro={isPro} showToast={showToast} isAdmin={isAdmin} setIsAdmin={setIsAdmin} />
      <WelcomeProModal isOpen={showWelcomeModal && user?.isAnonymous} onClose={() => setShowWelcomeModal(false)} onLoginClick={() => setShowAuthModal(true)} />
    </div>
  );
}

try {
    const rootElement = document.getElementById('root');
    if (rootElement) createRoot(rootElement).render(<FiskeAppen/>);
} catch (err) { console.error(err); }

const loader = document.getElementById('loading-screen');
if (loader) loader.remove();
</script>
</body>
</html>
