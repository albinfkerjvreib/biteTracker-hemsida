const firebaseConfig = {

  projectId: "bitetracker-4b619",
  storageBucket: "bitetracker-4b619.firebasestorage.app",

const app = firebase.apps.length === 0 ? firebase.initializeApp(firebaseConfig) : firebase.app();

const themes = {

const handleGoogleLogin = async () => {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithRedirect(provider);
  } catch (err) { alert("Inloggningsfel: " + err.message); }
};

const handleEmailAuth = async (email, password, isSignUp) => {
  try {
    if (isSignUp) await auth.createUserWithEmailAndPassword(email, password);
    else await auth.signInWithEmailAndPassword(email, password);
  } catch (err) { alert("Fel: " + err.message); }
};

function WelcomeProModal({ isOpen, onClose, onLoginClick }) {

        </div>

}

  const [password, setPassword] = useState('');

  return (
    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[2000]">

        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 bg-slate-100 p-1.5 rounded-full"><X className="h-5 w-5"/></button>
        {user && !user.isAnonymous ? (

            <div className="w-16 h-16 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✨</div>

            <p className="text-xs text-slate-500">{user.email}</p>

        ) : (
          <form onSubmit={(e) => { e.preventDefault(); handleEmailAuth(email, password, isSignUp); }} className="space-y-3">

            <button type="button" onClick={handleGoogleLogin} className="w-full bg-white border border-slate-300 text-slate-700 font-bold p-3.5 rounded-xl text-sm flex items-center justify-center gap-2">🌐 Google</button>
            <input type="email" placeholder="E-post" value={email} onChange={e => setEmail(e.target.value)} required className="w-full p-3.5 bg-slate-50 border rounded-xl text-sm" />
            <input type="password" placeholder="Lösenord" value={password} onChange={e => setPassword(e.target.value)} required className="w-full p-3.5 bg-slate-50 border rounded-xl text-sm" />
            <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold p-3.5 rounded-xl text-sm`}>{isSignUp ? 'Skapa konto' : 'Logga in'}</button>
            <div className="text-center pt-2"><button type="button" onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-blue-600 font-semibold">{isSignUp ? 'Har du konto? Logga in' : 'Skapa konto gratis'}</button></div>
          </form>
        )}
      </div>
    </div>
  );
}

// --- AI CHAT ---
function AIChatView({ t, currentTheme, lures, catches }) {
  const [messages, setMessages] = useState([{ sender: 'ai', text: "Hej! Jag är din fiske-AI. Fråga mig om beten eller taktik!" }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const chatEndRef = useRef(null);

  const handleSend = async (e) => {
    e.preventDefault();
    if (!input.trim() || loading) return;
    const userMsg = input; setInput('');
    setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
    setLoading(true);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: "system", content: "Fiskeexpert." }, { role: "user", content: userMsg }] })
      });
      const data = await res.json();
      setMessages(prev => [...prev, { sender: 'ai', text: data.choices?.[0]?.message?.content || "Inget svar." }]);
    } catch(err) { setMessages(prev => [...prev, { sender: 'ai', text: "Nätverksfel." }]); }
    finally { setLoading(false); }
  };
  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  return (
    <div className="p-4 flex flex-col h-[calc(100vh-140px)] max-w-xl mx-auto">
      <div className="bg-white p-4 rounded-2xl shadow-sm border mb-3 flex items-center justify-between">
        <h2 className={`text-xl font-bold ${currentTheme.text} flex items-center gap-2`}><Bot className="h-6 w-6"/> {t('ai_title')}</h2>
        <span className="bg-teal-50 text-teal-700 text-xs font-bold px-3 py-1 rounded-full">PRO</span>
      </div>
      <div className="flex-1 bg-white border rounded-2xl p-4 shadow-sm overflow-y-auto space-y-3 mb-3">
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[85%] p-3.5 rounded-2xl text-sm ${m.sender === 'user' ? `${currentTheme.bg} text-white rounded-br-none` : 'bg-slate-100 text-slate-800 rounded-bl-none'}`}>{m.text}</div>
          </div>
        ))}
        <div ref={chatEndRef} />
      </div>
      <form onSubmit={handleSend} className="flex gap-2">
        <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder={t('ai_placeholder')} className="flex-1 p-3.5 bg-white border rounded-xl text-sm" />
        <button type="submit" className={`${currentTheme.bg} text-white px-5 rounded-xl`}><Send className="h-5 w-5"/></button>
      </form>
    </div>
  );
}

// --- FLÖDE ---
function FeedView({ globalFeed, user, t, currentTheme, isPro, setShowAuthModal }) {
  const handleLike = async (post) => {
    if (!user || user.isAnonymous) { setShowAuthModal(true); return; }
    const ref = db.collection('artifacts').doc(appId).collection('public_feed').doc(post.id);
    const likes = post.likes || [];
    if (likes.includes(user.uid)) await ref.update({ likes: firebase.firestore.FieldValue.arrayRemove(user.uid) });
    else await ref.update({ likes: firebase.firestore.FieldValue.arrayUnion(user.uid) });
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      {!isPro && (
        <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
          <div><h3 className="font-bold text-sm">✨ Lås upp BiteTracker PRO</h3><p className="text-xs text-amber-100">Spara fångster & beten permanent!</p></div>
          <button onClick={() => setShowAuthModal(true)} className="bg-white text-amber-900 font-bold px-4 py-2 rounded-xl text-xs">Logga In</button>
        </div>
      )}
      <div className="bg-gradient-to-br from-teal-800 to-slate-900 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div><span className="text-[10px] text-teal-300 font-black">VÄDER & NAPPINDEX</span><h3 className="font-bold text-base flex items-center gap-1.5"><SunIcon className="h-5 w-5 text-amber-400"/> 16°C • Vind 3.5 m/s</h3></div>
        <div className="bg-amber-400 text-slate-900 font-black px-3 py-2 rounded-xl text-center text-xs"><span>🔥 Nappindex</span><span className="block text-sm">9/10</span></div>
      </div>
      <div className="space-y-4">
        {globalFeed.map(post => {
          const likesCount = (post.likes || []).length;
          const hasLiked = user && !user.isAnonymous && (post.likes || []).includes(user.uid);
          return (
            <div key={post.id} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
              <div className="p-4 flex items-center justify-between border-b">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-xs">{post.authorName?.charAt(0) || 'F'}</div>
                  <div><span className="font-bold text-sm flex items-center gap-1">{post.authorName || 'Fiskare'} {post.isOG && <span className="bg-amber-400 text-slate-900 text-[9px] font-black px-1.5 py-0.2 rounded-full">🏆 OG</span>}</span><span className="text-[10px] text-slate-400">{post.location}</span></div>
                </div>
                <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">{post.species}</span>
              </div>
              {post.image && <img src={post.image} alt={post.species} className="w-full h-64 object-cover" />}
              <div className="p-4 space-y-2">
                <p className="text-sm font-semibold">⚖️ {post.weight} kg {post.length ? `• 📏 ${post.length} cm` : ''} {post.lure ? `• 🎣 ${post.lure}` : ''}</p>
                {post.description && <p className="text-xs text-slate-600">"{post.description}"</p>}
                <button onClick={() => handleLike(post)} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-xl ${hasLiked ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-600'}`}><Heart className={`h-4 w-4 ${hasLiked ? 'fill-red-500 text-red-500' : ''}`}/> {likesCount}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// --- TÄVLINGAR MED TID, TYP OCH SKICKA IN BIDRAG ---
function CompetitionView({ globalFeed, user, t, currentTheme, isPro, catches }) {
  const [competitions, setCompetitions] = useState([]);
  const [showCreateModal, setShowCreateModal] = useState(false);
  const [showSubmitModal, setShowSubmitModal] = useState(false);
  const [selectedComp, setSelectedComp] = useState(null);
  const [selectedCatchId, setSelectedCatchId] = useState('');

  const [compTitle, setCompTitle] = useState('');
  const [compTarget, setCompTarget] = useState('Gädda');
  const [compType, setCompType] = useState('weight'); // 'weight' eller 'length'
  const [compDuration, setCompDuration] = useState('7'); // dagar
  const [joinCode, setJoinCode] = useState('');

  useEffect(() => {
    db.collection('artifacts').doc(appId).collection('competitions').onSnapshot(snap => {
      const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() })); setCompetitions(list);
    });
  }, []);

  const handleCreateComp = async (e) => {
    e.preventDefault();
    if (!compTitle) return;
    const expiresAt = Date.now() + parseInt(compDuration) * 24 * 60 * 60 * 1000;
    await db.collection('artifacts').doc(appId).collection('competitions').add({
      title: compTitle, target: compTarget, type: compType, expiresAt,
      creator: user?.email || 'Fiskare',
      code: Math.random().toString(36).substring(2, 8).toUpperCase(),
      participants: [user?.uid || 'guest'],
      submissions: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setShowCreateModal(false); setCompTitle('');
    alert("Tävling skapad!");
  };

  const handleJoinComp = async (e) => {
    e.preventDefault();
    if (!joinCode) return;
    const snap = await db.collection('artifacts').doc(appId).collection('competitions').where('code', '==', joinCode.toUpperCase()).get();
    if (snap.empty) alert("Hittade ingen tävling.");
    else {
      const doc = snap.docs[0];
      await doc.ref.update({ participants: firebase.firestore.FieldValue.arrayUnion(user?.uid || 'guest') });
      alert(`Gick med i ${doc.data().title}!`);
      setJoinCode('');
    }
  };

  const handleSubmitCatch = async (e) => {
    e.preventDefault();
    if (!selectedComp || !selectedCatchId) return;
    const chosenCatch = catches.find(c => c.id === selectedCatchId);
    if (!chosenCatch) return;

    const submission = {
      userId: user.uid,
      userName: user.email || 'Fiskare',
      species: chosenCatch.species,
      value: selectedComp.type === 'weight' ? chosenCatch.weight : (chosenCatch.length || 0),
      lure: chosenCatch.lure || 'Okänt',
      date: new Date().toLocaleDateString()
    };

    const compRef = db.collection('artifacts').doc(appId).collection('competitions').doc(selectedComp.id);
    const existing = selectedComp.submissions || [];
    // Ersätt eller lägg till användarens bidrag
    const filtered = existing.filter(s => s.userId !== user.uid);
    filtered.push(submission);

    await compRef.update({ submissions: filtered });
    setShowSubmitModal(false); setSelectedComp(null); setSelectedCatchId('');
    alert("✅ Bidrag skickat till tävlingen!");
  };

  return (
    <div className="p-4 space-y-4 max-w-xl mx-auto">
      <div className="bg-white p-4 rounded-2xl shadow-sm border flex items-center justify-between">
        <div><h2 className={`text-xl font-bold ${currentTheme.text} flex items-center gap-2`}><Trophy className="h-6 w-6 text-amber-500"/> Tävlingar</h2><p className="text-xs text-slate-500">Största eller längsta fisken</p></div>
        <button onClick={() => { if(!isPro){alert("Kräver PRO!"); return;} setShowCreateModal(true); }} className={`${currentTheme.bg} text-white text-xs font-bold px-3.5 py-2 rounded-xl`}>+ Skapa Privat</button>
      </div>

      <form onSubmit={handleJoinComp} className="bg-white p-4 rounded-2xl shadow-sm border flex gap-2">
        <input type="text" placeholder="Inbjudningskod..." value={joinCode} onChange={e => setJoinCode(e.target.value)} className="flex-1 p-3 bg-slate-50 border rounded-xl text-sm uppercase" />
        <button type="submit" className="bg-amber-600 text-white font-bold px-4 rounded-xl text-xs">Gå med</button>
      </form>

      {competitions.map(c => {
        const isExpired = Date.now() > c.expiresAt;
        const subs = c.submissions || [];
        subs.sort((a, b) => b.value - a.value); // Högst vinner
        const winner = subs.length > 0 ? subs[0] : null;

        return (
          <div key={c.id} className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
            <div className="flex justify-between items-start">
              <div>
                <h3 className="font-bold text-slate-800 text-base">🏆 {c.title}</h3>
                <p className="text-[10px] text-slate-500">Mål: {c.target} • Typ: {c.type === 'weight' ? 'Största (kg)' : 'Längsta (cm)'}</p>
                <p className={`text-[10px] font-bold mt-1 ${isExpired ? 'text-red-600' : 'text-emerald-600'}`}>
                  {isExpired ? '🏁 Tävlingen är avslutad!' : `⏰ Tid kvar: ${Math.ceil((c.expiresAt - Date.now()) / (1000*60*60*24))} dagar`}
                </p>
              </div>
              <span className="bg-amber-100 text-amber-800 text-xs font-black px-2.5 py-1 rounded-lg">{c.code}</span>
            </div>

            {/* Vinnare / Resultat */}
            {isExpired && winner && (
              <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center space-y-1">
                <span className="text-amber-800 font-bold text-xs block">🥇 VINNARE AV TÄVLINGEN!</span>
                <p className="text-sm font-black text-slate-800">{winner.userName} ({winner.value} {c.type === 'weight' ? 'kg' : 'cm'} {winner.species})</p>
              </div>
            )}

            <div className="space-y-1 pt-2 border-t">
              <p className="text-xs font-bold text-slate-500">Ställning:</p>
              {subs.length === 0 ? <p className="text-xs text-slate-400">Inga inskickade bidrag ännu.</p> : subs.map((s, idx) => (
                <div key={idx} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg">
                  <span>#{idx+1} {s.userName}</span>
                  <span className="font-bold text-emerald-700">{s.value} {c.type === 'weight' ? 'kg' : 'cm'}</span>
                </div>
              ))}
            </div>

            {!isExpired && user && !user.isAnonymous && (
              <button onClick={() => { setSelectedComp(c); setShowSubmitModal(true); }} className="w-full bg-teal-700 text-white font-bold py-2 rounded-xl text-xs">
                📤 Skicka in bidrag från dina fångster
              </button>
            )}
          </div>
        );
      })}

      {showCreateModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={handleCreateComp} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg text-slate-800">Skapa Tävling</h3>
            <input type="text" placeholder="Tävlingsnamn" value={compTitle} onChange={e => setCompTitle(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />

function MapView({ user, currentTheme, isPro }) {
  const [leafletLoaded, setLeafletLoaded] = useState(false);
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersLayer = useRef(null);
  const tileLayerRef = useRef(null);

  const [mapStyle, setMapStyle] = useState('topo'); // 'topo', 'satellite', 'depth'
  const [approvedLakes, setApprovedLakes] = useState([]);
  const [privateMarkers, setPrivateMarkers] = useState([]);
  const [globalCatches, setGlobalCatches] = useState([]);

  const [showLakes, setShowLakes] = useState(true);
  const [showPrivate, setShowPrivate] = useState(true);
  const [showCatches, setShowCatches] = useState(true);

  const [clickedCoords, setClickedCoords] = useState(null);
  const [showSuggestModal, setShowSuggestModal] = useState(false);
  const [showPrivateModal, setShowPrivateModal] = useState(false);

  const [suggestName, setSuggestName] = useState('');
  const [suggestRules, setSuggestRules] = useState('');
  const [suggestFish, setSuggestFish] = useState('');
  const [privateTitle, setPrivateTitle] = useState('');
  const [privateType, setPrivateType] = useState('Brygga');

  useEffect(() => {
    db.collection('artifacts').doc(appId).collection('approved_lakes').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setApprovedLakes(l); });
    db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setGlobalCatches(l); });
  }, []);

  useEffect(() => {
    if (!user || user.isAnonymous) return;
    db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('private_pins').onSnapshot(snap => { const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() })); setPrivateMarkers(l); });
  }, [user]);

  useEffect(() => {
    if (window.L) { setLeafletLoaded(true); return; }
    const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(link);
    const script = document.createElement('script'); script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; script.onload = () => setLeafletLoaded(true); document.head.appendChild(script);
  }, []);

  useEffect(() => {
    if (!leafletLoaded || !mapRef.current || mapInstance.current) return;
    const map = window.L.map(mapRef.current, { zoomControl: false, tap: true }).setView([60.128, 18.643], 5);
    tileLayerRef.current = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);
    window.L.control.zoom({ position: 'bottomright' }).addTo(map);

    map.on('click', (e) => setClickedCoords({ lat: e.latlng.lat, lng: e.latlng.lng }));
    mapInstance.current = map;
    markersLayer.current = window.L.layerGroup().addTo(map);
  }, [leafletLoaded]);

  const changeMapStyle = (style) => {
    setMapStyle(style);
    if (!mapInstance.current || !window.L) return;
    if (tileLayerRef.current) mapInstance.current.removeLayer(tileLayerRef.current);

    let url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
    if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
    if (style === 'depth') url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';

    tileLayerRef.current = window.L.tileLayer(url).addTo(mapInstance.current);
  };

  useEffect(() => {
    if (!mapInstance.current || !markersLayer.current || !window.L) return;
    markersLayer.current.clearLayers();

    if (showLakes) {
      approvedLakes.forEach(l => {
        if (l.lat && l.lng) window.L.marker([l.lat, l.lng]).addTo(markersLayer.current).bindPopup(`<b>🌊 ${l.name}</b><br>${l.rules}`);
      });
    }
    if (showPrivate && isPro) {
      privateMarkers.forEach(p => {
        if (p.lat && p.lng) window.L.marker([p.lat, p.lng]).addTo(markersLayer.current).bindPopup(`<b>🔒 ${p.title}</b>`);
      });
    }
    if (showCatches) {
      globalCatches.forEach(c => {
        if (c.lat && c.lng) window.L.marker([c.lat, c.lng]).addTo(markersLayer.current).bindPopup(`<b>🐟 ${c.species} (${c.weight} kg)</b>`);
      });
    }
  }, [approvedLakes, privateMarkers, globalCatches, showLakes, showPrivate, showCatches, isPro, leafletLoaded]);

  return (
    <div className="relative w-full h-[calc(100vh-140px)]">
      {/* Kart-väljare & Filter */}
      <div className="absolute top-4 left-4 right-4 z-[400] max-w-xl mx-auto space-y-2">
        <div className="flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-lg border text-xs font-bold">
          <button onClick={() => setShowLakes(!showLakes)} className={`flex-1 py-1 rounded-xl ${showLakes ? 'bg-teal-700 text-white' : 'bg-slate-100'}`}>🌊 Sjöar</button>
          <button onClick={() => setShowCatches(!showCatches)} className={`flex-1 py-1 rounded-xl ${showCatches ? 'bg-emerald-600 text-white' : 'bg-slate-100'}`}>🐟 Fångster</button>
          <button onClick={() => setShowPrivate(!showPrivate)} className={`flex-1 py-1 rounded-xl ${showPrivate ? 'bg-amber-600 text-white' : 'bg-slate-100'}`}>⚓ Privata</button>
        </div>
        <div className="flex gap-1.5 bg-white/95 backdrop-blur-md p-1 rounded-xl shadow border text-[10px] font-bold">
          <button onClick={() => changeMapStyle('topo')} className={`flex-1 py-1 rounded-lg ${mapStyle === 'topo' ? 'bg-teal-700 text-white' : 'bg-slate-100'}`}>Standard</button>
          <button onClick={() => changeMapStyle('satellite')} className={`flex-1 py-1 rounded-lg ${mapStyle === 'satellite' ? 'bg-teal-700 text-white' : 'bg-slate-100'}`}>🛰️ Satellit</button>
          <button onClick={() => changeMapStyle('depth')} className={`flex-1 py-1 rounded-lg ${mapStyle === 'depth' ? 'bg-teal-700 text-white' : 'bg-slate-100'}`}>🗺️ Djupkarta</button>
        </div>
      </div>

      <div ref={mapRef} className="w-full h-full" />

      {clickedCoords && !showSuggestModal && !showPrivateModal && (
        <div className="absolute bottom-4 left-4 right-4 bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border z-[1000] max-w-xl mx-auto space-y-2">
          <h3 className="font-bold text-slate-800 text-xs">📍 Position vald på kartan</h3>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => setShowSuggestModal(true)} className="bg-teal-700 text-white font-bold p-2.5 rounded-xl text-xs">Föreslå sjö</button>
            <button onClick={() => setShowPrivateModal(true)} className="bg-amber-600 text-white font-bold p-2.5 rounded-xl text-xs">Spara privat</button>
          </div>
        </div>
      )}

      {showSuggestModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={async (e) => {
            e.preventDefault();
            await db.collection('artifacts').doc(appId).collection('lake_suggestions').add({ name: suggestName, rules: suggestRules || 'Standard', fish: suggestFish || 'Diverse', lat: clickedCoords.lat, lng: clickedCoords.lng, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            setShowSuggestModal(false); setClickedCoords(null); alert("Sjö inskickad!");
          }} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg">Föreslå Sjö</h3>
            <input type="text" placeholder="Sjöns namn" value={suggestName} onChange={e => setSuggestName(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <button type="submit" className="w-full bg-teal-700 text-white p-3 rounded-xl font-bold text-sm">Skicka</button>
          </form>
        </div>
      )}

      {showPrivateModal && (
        <div className="fixed inset-0 bg-black/60 z-[2000] flex items-center justify-center p-4">
          <form onSubmit={async (e) => {
            e.preventDefault();
            await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('private_pins').add({ title: privateTitle, type: privateType, lat: clickedCoords.lat, lng: clickedCoords.lng, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            setShowPrivateModal(false); setClickedCoords(null); alert("Privat plats sparad!");
          }} className="bg-white p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 className="font-bold text-lg">Spara Privat Markör</h3>
            <input type="text" placeholder="Titel" value={privateTitle} onChange={e => setPrivateTitle(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
            <button type="submit" className="w-full bg-amber-600 text-white p-3 rounded-xl font-bold text-sm">Spara</button>
          </form>
        </div>
      )}
    </div>
  );
}

// --- LOGGA FÅNGST MED MINI-KARTA ---
function CatchLogView({ user, t, currentTheme, profile }) {
  const [species, setSpecies] = useState('');
  const [weight, setWeight] = useState('');
  const [length, setLength] = useState('');
  const [lure, setLure] = useState('');
  const [description, setDescription] = useState('');
  const [image, setImage] = useState(null);
  const [location, setLocation] = useState('');
  const [coords, setCoords] = useState({ lat: 59.3293, lng: 18.0686 }); // Standard Stockholm

  const miniMapRef = useRef(null);
  const miniMapInstance = useRef(null);
  const miniMarkerRef = useRef(null);

  useEffect(() => {
    if (!window.L || !miniMapRef.current || miniMapInstance.current) return;
    const map = window.L.map(miniMapRef.current, { zoomControl: false, attributionControl: false }).setView([coords.lat, coords.lng], 10);
    window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);

    const marker = window.L.marker([coords.lat, coords.lng], { draggable: true }).addTo(map);
    marker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      setCoords({ lat: pos.lat, lng: pos.lng });
    });

    map.on('click', (e) => {
      marker.setLatLng(e.latlng);
      setCoords({ lat: e.latlng.lat, lng: e.latlng.lng });
    });

    miniMapInstance.current = map;
    miniMarkerRef.current = marker;
  }, []);

  const handleSave = async (e) => {
    e.preventDefault();
    if (!species || !weight || !location) return;
    try {
      const data = {
        species, weight: parseFloat(weight), length: length ? parseFloat(length) : null,
        lure, description, image, location, lat: coords.lat, lng: coords.lng,
        authorName: profile.displayName || 'Fiskare', isOG: profile.isOG || false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').add(data);
      await db.collection('artifacts').doc(appId).collection('public_feed').add(data);
      setSpecies(''); setWeight(''); setLength(''); setLure(''); setDescription(''); setImage(null); setLocation('');
      alert("✅ Fångst sparad och publicerad på kartan!");
    } catch(err) { alert("Fel vid sparande."); }
  };

  return (
    <div className="p-4 max-w-xl mx-auto space-y-4 pb-10">
      <div className="bg-white p-4 rounded-2xl shadow-sm border"><h2 className={`text-xl font-bold ${currentTheme.text}`}>Logga Fångst</h2></div>
      <form onSubmit={handleSave} className="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
        <input type="text" placeholder="Fiskart (t.ex. Gädda)" value={species} onChange={e => setSpecies(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        <div className="grid grid-cols-2 gap-2">
          <input type="number" step="0.1" placeholder="Vikt (kg)" value={weight} onChange={e => setWeight(e.target.value)} required className="p-3 bg-slate-50 border rounded-xl text-sm" />
          <input type="number" placeholder="Längd (cm)" value={length} onChange={e => setLength(e.target.value)} className="p-3 bg-slate-50 border rounded-xl text-sm" />
        </div>
        <input type="text" placeholder="Bete / Drag" value={lure} onChange={e => setLure(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />
        <input type="text" placeholder="Plats / Sjö (skriv namn)" value={location} onChange={e => setLocation(e.target.value)} required className="w-full p-3 bg-slate-50 border rounded-xl text-sm" />

        {/* MINIKARTA FÖR ATT VÄLJA EXAKT POSITION */}
        <div className="space-y-1">
          <label className="text-xs font-bold text-slate-700">Dra markören på minikartan för att sätta exakt position:</label>
          <div ref={miniMapRef} className="w-full h-40 rounded-xl border shadow-inner z-0" />
        </div>

        <textarea placeholder="Beskrivning..." value={description} onChange={e => setDescription(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-20 resize-none" />
        <input type="file" accept="image/*" onChange={e => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend = () => setImage(r.result); r.readAsDataURL(f); }}} className="w-full text-xs" />
        <button type="submit" className={`w-full ${currentTheme.bg} text-white font-bold p-3.5 rounded-xl shadow`}>Spara Fångst</button>
      </form>
    </div>
  );
}

  const t = (key) => translations['sv']?.[key] || key;
  const currentTheme = themes[appTheme] || themes.blue;

  useEffect(() => {
    const initAuth = async () => { try { await auth.signInAnonymously(); } catch (e) {} setIsLoadingAuth(false); };
    initAuth();
    const unsubscribe = auth.onAuthStateChanged((currentUser) => { setUser(currentUser); setIsLoadingAuth(false); });
    return () => unsubscribe();
  }, []);

  useEffect(() => {
    if (!user || user.isAnonymous) return;
    const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile');
    profileRef.get().then(async doc => {
      const data = doc.exists ? doc.data() : {};
      if (data.isOG === undefined) {
        const usersSnap = await db.collection('artifacts').doc(appId).collection('users').get();
        const isOG = usersSnap.size <= 25;
        await profileRef.set({ isOG }, { merge: true });
        setProfile(prev => ({ ...prev, isOG }));
      } else { setProfile(data); }
    });
  }, [user]);

  useEffect(() => {
    if (!user) return;
    const unsubC = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('catches').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setCatches(f); });
    const unsubG = db.collection('artifacts').doc(appId).collection('public_feed').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setGlobalFeed(f); });
    const unsubL = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('lures').onSnapshot(snap => { const f = []; snap.forEach(d => f.push({ id: d.id, ...d.data() })); setLures(f); });
    const unsubP = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('settings').doc('profile').onSnapshot(docSnap => { if (docSnap.exists) setProfile(prev => ({ ...prev, ...docSnap.data() })); });
    return () => { unsubC(); unsubG(); unsubL(); unsubP(); };
  }, [user]);

  if (isLoadingAuth) return <div className="flex h-screen items-center justify-center bg-slate-900 text-white"><h1 className="text-2xl font-black">BiteTracker</h1></div>;

  return (
    <div className="flex flex-col h-screen bg-slate-50 font-sans">
      <header className={`${currentTheme.bg} text-white p-4 shadow-md flex items-center justify-between z-10 shrink-0`}>
        <div className="flex items-center gap-3">
          <img src="179412295382.jpg" alt="Logo" className="h-8 w-8 rounded-lg object-cover" />
          <h1 className="text-xl font-bold">{t('appTitle')}</h1>
        </div>
        <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-1.5 text-white/90 py-1 px-3 bg-black/20 rounded-xl text-xs font-bold">
          <User className="h-4 w-4"/> {user?.isAnonymous ? 'Logga In' : (profile.displayName || user?.email)}
        </button>
      </header>

      <main className="flex-1 overflow-y-auto pb-20">
        {activeTab === 'feed' && <FeedView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} setShowAuthModal={setShowAuthModal} t={t} user={user}/>}
        {activeTab === 'compete' && <CompetitionView currentTheme={currentTheme} globalFeed={globalFeed} isPro={isPro} t={t} user={user} catches={catches}/>}
        {activeTab === 'ai' && <AIChatView catches={catches} currentTheme={currentTheme} lures={lures} t={t}/>}
        {activeTab === 'map' && <MapView currentTheme={currentTheme} isPro={isPro} user={user}/>}
        {activeTab === 'log' && <CatchLogView currentTheme={currentTheme} profile={profile} t={t} user={user}/>}
        {activeTab === 'profile' && <ProfileView currentTheme={currentTheme} isPro={isPro} profile={profile} setShowAuthModal={setShowAuthModal} user={user} onOpenSettings={() => setShowSettingsModal(true)} catches={catches} lures={lures}/>}
      </main>

      <nav className="fixed bottom-0 w-full bg-white border-t border-slate-200 z-20 shadow">
        <div className="flex justify-around items-center p-1.5">
          <NavItem Icon={Compass} isActive={activeTab === 'feed'} label={t('nav_feed')} onClick={() => setActiveTab('feed')} currentTheme={currentTheme} />
          <NavItem Icon={Trophy} isActive={activeTab === 'compete'} label={t('nav_compete')} onClick={() => setActiveTab('compete')} currentTheme={currentTheme} />
          <NavItem Icon={Bot} isActive={activeTab === 'ai'} label={t('nav_ai')} onClick={() => setActiveTab('ai')} currentTheme={currentTheme} />
          <NavItem Icon={MapComponent} isActive={activeTab === 'map'} label={t('nav_map')} onClick={() => setActiveTab('map')} currentTheme={currentTheme} />
          <NavItem Icon={Fish} isActive={activeTab === 'log'} label={t('nav_log')} onClick={() => setActiveTab('log')} currentTheme={currentTheme} />
          <NavItem Icon={User} isActive={activeTab === 'profile'} label={t('nav_profile')} onClick={() => setActiveTab('profile')} currentTheme={currentTheme} />
        </div>
      </nav>

      <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} user={user} currentTheme={currentTheme} />
      <SettingsModal isOpen={showSettingsModal} onClose={() => setShowSettingsModal(false)} user={user} profile={profile} appTheme={appTheme} setAppTheme={setAppTheme} setShowAuthModal={setShowAuthModal} currentTheme={currentTheme} isPro={isPro} />
      <WelcomeProModal isOpen={showWelcomeModal && user?.isAnonymous} onClose={() => setShowWelcomeModal(false)} onLoginClick={() => setShowAuthModal(true)} />
    </div>
  );
}

try {
    const rootElement = document.getElementById('root');
    if (rootElement) createRoot(rootElement).render(<FiskeAppen/>);
} catch (err) { console.error(err); }

const loader = document.getElementById('loading-screen');
if (loader) loader.remove();
</script>
</body>
</html>
